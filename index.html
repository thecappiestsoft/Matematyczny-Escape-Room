adomosc_regal:{title:"Wiadomość zza książek",text:b("„Kufer otworzysz kodem: LITERA figury o NAJWIĘKSZYM polu z obrazu w bibliotece, a po niej LICZBA zakreślona w kalendarzu pokoju nauczycielskiego.”")},obraz:{title:"Obraz z figurami",text:G("Na obrazie namalowano cztery figury oznaczone literami A–D.","Na obrazie namalowano cztery figury oznaczone literami A–D.","Obraz przedstawia cztery arkusze blachy (A–D) z warsztatu szkolnego."),visual:G({type:"shapes",shapes:[{kind:"rect",label:"A",dims:["6 cm × 4 cm"]},{kind:"square",label:"B",dims:["bok 5 cm"]},{kind:"triangle",label:"C",dims:["podstawa 10 cm","wysokość 6 cm"]},{kind:"trapezoid",label:"D",dims:["podstawy 4 cm i 6 cm","wysokość 5 cm"]}]},{type:"shapes",shapes:[{kind:"circle",label:"A",dims:["promień 3"]},{kind:"triangle",label:"B",dims:["trójkąt równoboczny","bok 8"]},{kind:"rect",label:"C",dims:["5 × 5,5"]},{kind:"rhombus",label:"D",dims:["przekątne 7 i 8"]}]},{type:"shapes",shapes:[{kind:"rect",label:"A",dims:["1,2 m × 0,8 m"]},{kind:"circle",label:"B",dims:["średnica 1,1 m"]},{kind:"triangle",label:"C",dims:["podstawa 1,5 m","wysokość 1,2 m"]},{kind:"trapezoid",label:"D",dims:["podstawy 1,0 m i 0,9 m","wysokość 1,0 m"]}]})},teczka:{title:"Teczka „Klasa 1926”",text:G("W teczce: „Każdy symbol to cyfra. ★ + ★ = 10,  ★ + ● = 8,  ● · ▲ = 21,  ▲ − ■ = 5”.","W teczce: „★ i ● spełniają układ: ★ + ● = 9, ★ − ● = 1.  ▲ jest rozwiązaniem równania ▲² − 6▲ + 9 = 0.  ■ spełnia 2^■ = 64”.","W teczce kosztorys remontu drzwi: ★ = liczba litrowych puszek farby na ścianę 40 m² (1 l farby na 8 m²); ● = ile godzin zajmie praca 3 osobom, jeśli wymaga 12 roboczogodzin; ▲ = rabat w % (cena 300 zł, po rabacie 291 zł); ■ = 6000 cm³ wyrażone w litrach.")},symbole:{title:"Symbole na ścianie",text:b("Nad drzwiami wyjściowymi namalowano kolejność symboli: ▲ ★ ■ ●. Obok: „Tak ustaw pokrętła wyjścia”."),visual:b({type:"symbols",items:["▲","★","■","●"],caption:"kolejność pokręteł"})},kronika:{title:"Kronika szkoły",text:b("„Rok 1926. Nasza klasa matematyczna ukryła w szkole zagadki dla przyszłych pokoleń. Kto je rozwiąże, ten znajdzie drogę do wyjścia – i nasz zeszyt.”")}},puzzles:{tablica:{variants:G({kind:"number",title:"Działania na tablicy",topic:"kolejnosc",prompt:"Na tablicy ktoś zapisał kredą: (18 − 3 · 4) + 12 : 4 − 2 = ?  Oblicz wartość wyrażenia.",answer:7,hints:["Nie licz od lewej do prawej! Pamiętaj o kolejności działań.","Najpierw nawias (a w nim mnożenie), potem dzielenie, na końcu dodawanie i odejmowanie.","3 · 4 = 12; 18 − 12 = 6; 12 : 4 = 3; 6 + 3 − 2 = 7. Odpowiedź: 7."]},{kind:"number",title:"Równanie na tablicy",topic:"rownania",prompt:"Na tablicy ktoś zapisał równanie: 2(x − 3) + 5 = x + 6. Wyznacz x.",answer:7,hints:["Zacznij od opuszczenia nawiasu.","2(x − 3) = 2x − 6. Przenieś wyrazy z x na lewą stronę, liczby na prawą.","2x − 6 + 5 = x + 6 → 2x − 1 = x + 6 → x = 7."]},{kind:"number",title:"Obniżka na tablicy",topic:"procenty",unit:"zł",prompt:"Na tablicy zapisano: „Cena zeszytu po obniżce o 30% wynosi 4,90 zł”. Ile kosztował zeszyt przed obniżką (w zł)?",answer:7,hints:["Po obniżce o 30% płacisz tylko część pierwotnej ceny – jaką?","Cena po obniżce to 70% ceny początkowej: 0,7 · x = 4,90.","x = 4,90 : 0,7 = 7 zł."]})},szuflada:{variants:G({kind:"code",style:"dials",title:"Szuflada biurka",topic:"logika",answer:He("748"),prompt:"Szuflada ma zamek z trzema pokrętłami (0–9). Połącz wskazówki z tablicy, zegara i plakatu.",hints:["Notatka z plecaka mówi, skąd wziąć każdą cyfrę i w jakiej kolejności.","Cyfra 1: wynik z tablicy. Cyfra 2: godzina na zegarze. Cyfra 3: obwód kwadratu = 4 · a.","Tablica: 7, zegar: 4 (godz. 4:00), plakat: 4 · 2 = 8. Kod: 748."]},{kind:"code",style:"dials",title:"Szuflada biurka",topic:"logika",answer:He("748"),prompt:"Szuflada ma zamek z trzema pokrętłami (0–9). Połącz wskazówki z tablicy, zegara i plakatu.",hints:["Notatka z plecaka mówi, skąd wziąć każdą cyfrę i w jakiej kolejności.","Tarcza zegara to 360°, czyli 30° na każdą godzinę. log₂ 256 = c ⇔ 2ᶜ = 256.","Tablica: x = 7. Zegar 4:00 → kąt 120°, 120 : 30 = 4. 2⁸ = 256, więc log₂ 256 = 8. Kod: 748."]},{kind:"code",style:"dials",title:"Szuflada biurka",topic:"logika",answer:He("748"),prompt:"Szuflada ma zamek z trzema pokrętłami (0–9). Połącz wskazówki z tablicy, zegara i plakatu.",hints:["Notatka z plecaka mówi, skąd wziąć każdą cyfrę i w jakiej kolejności.","Godzina na tarczy to 30°. 1 m = 10 dm.","Tablica: 7 zł. Zegar 4:00 → 120° : 30° = 4. 2,4 m = 24 dm, 24 : 3 = 8. Kod: 748."]})},kosz:{bonus:!0,variants:G({kind:"number",title:"Zmięta kartka",topic:"ciagi",prompt:"Na kartce z kosza: 3, 6, 12, __, 48. Jaka liczba została zamazana?",answer:24,hints:["Porównaj każdą liczbę z poprzednią.","Każda kolejna liczba jest dwa razy większa od poprzedniej.","12 · 2 = 24 (sprawdzenie: 24 · 2 = 48)."]},{kind:"number",title:"Zmięta kartka",topic:"ciagi",prompt:"Na kartce z kosza: ciąg arytmetyczny, a₁ = 3, r = 4. Oblicz a₁₀.",answer:39,hints:["Skorzystaj ze wzoru na n-ty wyraz ciągu arytmetycznego.","aₙ = a₁ + (n − 1) · r.","a₁₀ = 3 + 9 · 4 = 39."]},{kind:"number",title:"Zmięta kartka",topic:"finanse",unit:"€",prompt:"Na kartce z kosza: kurs 1 € = 4,30 zł. Ile euro otrzymasz za 215 zł?",answer:50,hints:["Zastanów się, ile razy 4,30 zł mieści się w 215 zł.","Liczba euro = kwota w zł : kurs.","215 : 4,30 = 50 €."]})},komputer:{variants:G({kind:"choice",title:"Hasło do komputera",topic:"ulamki",prompt:"Ekran logowania: „Hasłem jest NAJWIĘKSZY ułamek”. Wybierz go.",options:["5/8","3/4","7/10","2/3"],correct:1,hints:["Ułamki o różnych mianownikach trudno porównać „na oko”.","Zamień ułamki na postać dziesiętną (podziel licznik przez mianownik).","5/8 = 0,625; 3/4 = 0,75; 7/10 = 0,7; 2/3 ≈ 0,667. Największy: 3/4."]},{kind:"choice",title:"Hasło do komputera",topic:"funkcje",prompt:"Ekran logowania: „Hasłem jest funkcja ROSNĄCA w całej swojej dziedzinie”. Wybierz ją.",options:["f(x) = −2x + 1","g(x) = (1/2)ˣ","h(x) = log₂ x","k(x) = −x²"],correct:2,hints:["Funkcja rosnąca: większy argument → większa wartość.","Funkcja liniowa rośnie dla a > 0, wykładnicza dla podstawy > 1, logarytmiczna dla podstawy > 1.","f maleje (a = −2), g maleje (podstawa 1/2), k nie jest monotoniczna, h(x) = log₂ x rośnie (podstawa 2 > 1)."]},{kind:"choice",title:"Hasło do komputera",topic:"finanse",prompt:"Ekran logowania: „Hasłem jest NAJKORZYSTNIEJSZA lokata roczna (bez podatku)”. Wybierz ją.",options:["A: 6,0% w skali roku, kapitalizacja roczna","B: 5,8% w skali roku, kapitalizacja miesięczna","C: 5,9% w skali roku, kapitalizacja kwartalna","D: 5,5% w skali roku, kapitalizacja dzienna"],correct:2,hints:["Częstsza kapitalizacja zwiększa zysk – nie wystarczy porównać samych procentów.","Roczny zysk przy kapitalizacji n razy w roku: (1 + r/n)ⁿ − 1.","A: 6,00%; B: (1 + 0,058/12)¹² ≈ 1,0596 → 5,96%; C: (1 + 0,059/4)⁴ ≈ 1,0603 → 6,03%; D < 5,7%. Najlepsza: C."]})},szafka:{variants:G({kind:"code",style:"keypad",title:"Szafka nauczycielska",topic:"wykresy",answer:He("1987"),prompt:"Szafka ma klawiaturę numeryczną na 4 cyfry. Pytanie jest w e-dzienniku, dane – na wykresie.",hints:["Najpierw zaloguj się do komputera – tam jest pytanie. Dane są na tablicy korkowej.","Sprawdź, ile książek wypożyczono w 1984 r., i pomnóż przez 2.","1984: 120 książek; 2 · 120 = 240 → rok 1987. Kod: 1987."]},{kind:"code",style:"keypad",title:"Szafka nauczycielska",topic:"funkcje",answer:He("1995"),prompt:"Szafka ma klawiaturę numeryczną na 4 cyfry. Pytanie jest w e-dzienniku, dane – na wykresie.",hints:["Najpierw zaloguj się do komputera – tam jest pytanie. Dane są na tablicy korkowej.","Wyznacz tempo wzrostu: o ile uczniów rocznie rośnie liczba? Potem przedłuż prostą.","Między 1980 a 1990 przybyło 100 uczniów → 10 rocznie. 350 − 200 = 150 → 15 lat po 1980 → 1995."]},{kind:"code",style:"keypad",title:"Szafka nauczycielska",topic:"statystyka",answer:He("2020"),prompt:"Szafka ma klawiaturę numeryczną na 4 cyfry. Pytanie jest w e-dzienniku, dane – na wykresie.",hints:["Najpierw zaloguj się do komputera – tam jest pytanie. Dane są na tablicy korkowej.","Wzrost procentowy = (nowa − stara) / stara · 100%. Policz dla każdego roku.","2019: +10%, 2020: +25%, 2021: +10%, 2022: ≈ +9,1%. Największy w 2020 r. Kod: 2020."]})},doniczka:{bonus:!0,variants:G({kind:"number",title:"Liścik w doniczce",topic:"jednostki",unit:"min",prompt:"Liścik: „Przerwa trwa 3/4 godziny”. Ile to minut?",answer:45,hints:["Godzina ma 60 minut.","Policz 3/4 z 60: najpierw 60 : 4, potem razy 3.","60 : 4 = 15; 15 · 3 = 45 minut."]},{kind:"number",title:"Liścik w doniczce",topic:"rownania",prompt:"Liścik: „3x − 7 > 11”. Podaj najmniejszą liczbę całkowitą spełniającą nierówność.",answer:7,hints:["Rozwiąż nierówność jak równanie, pilnując znaku.","3x > 18, więc x > 6.","x > 6 – najmniejsza liczba całkowita to 7."]},{kind:"number",title:"Liścik w doniczce",topic:"finanse",unit:"zł",prompt:"Liścik: „Woźny zarabia 32 zł brutto za godzinę”. Ile zarobi za 7,5 h pracy?",answer:240,hints:["Wynagrodzenie = stawka · czas.","32 · 7,5 = 32 · 7 + 32 · 0,5.","224 + 16 = 240 zł."]})},regal:{variants:G({kind:"order",title:"Książki na regale",topic:"ulamki",orderLabel:["najmniejsza","największa"],prompt:"Na grzbietach pięciu książek są liczby. Ustaw książki od NAJMNIEJSZEJ do NAJWIĘKSZEJ wartości.",items:["1/3","2/5","0,5","0,6","3/4"],hints:["Łatwiej porównać liczby zapisane w tej samej postaci.","Zamień ułamki zwykłe na dziesiętne: 1/3 ≈ 0,33; 2/5 = 0,4; 3/4 = 0,75.","Kolejność: 1/3 (0,33) → 2/5 (0,4) → 0,5 → 0,6 → 3/4 (0,75)."]},{kind:"order",title:"Książki na regale",topic:"potegi",orderLabel:["najmniejsza","największa"],prompt:"Na grzbietach pięciu książek są liczby. Ustaw książki od NAJMNIEJSZEJ do NAJWIĘKSZEJ wartości.",items:["2^1,5","log₂ 8","π","√10","10/3"],hints:["Oszacuj każdą liczbę z dokładnością do setnych.","2^1,5 = 2√2 ≈ 2,83; log₂ 8 = 3; π ≈ 3,14; √10 ≈ 3,16; 10/3 ≈ 3,33.","Kolejność: 2^1,5 → log₂ 8 → π → √10 → 10/3."]},{kind:"order",title:"Książki na regale",topic:"jednostki",orderLabel:["najkrótsza","najdłuższa"],prompt:"Na grzbietach książek są długości. Ustaw je od NAJKRÓTSZEJ do NAJDŁUŻSZEJ.",items:["95 cm","10,5 dm","0,0011 km","1150 mm","1,2 m"],hints:["Wyraź wszystkie długości w tej samej jednostce.","Zamień na milimetry: 1 cm = 10 mm, 1 dm = 100 mm, 1 m = 1000 mm, 1 km = 1 000 000 mm.","950 mm < 1050 mm < 1100 mm < 1150 mm < 1200 mm → 95 cm, 10,5 dm, 0,0011 km, 1150 mm, 1,2 m."]})},kufer:{variants:G({kind:"code",style:"letters",title:"Kufer z zamkiem szyfrowym",topic:"pola",answer:["C","2","1"],wheels:[zi,zt,zt],prompt:"Kufer ma zamek z trzema kółkami: litera, cyfra, cyfra.",hints:["Wiadomość zza książek mówi, czego potrzebujesz: obrazu i kalendarza.","Pola: prostokąt a·b, kwadrat a², trójkąt a·h/2, trapez (a+b)·h/2. Kalendarz: najpierw potęgowanie i dzielenie.","A = 24, B = 25, C = 30, D = 25 → C. Kalendarz: 16 + 5 = 21. Kod: C21."]},{kind:"code",style:"letters",title:"Kufer z zamkiem szyfrowym",topic:"pola",answer:["A","2","1"],wheels:[zi,zt,zt],prompt:"Kufer ma zamek z trzema kółkami: litera, cyfra, cyfra.",hints:["Wiadomość zza książek mówi, czego potrzebujesz: obrazu i kalendarza.","Koło πr², trójkąt równoboczny a²√3/4, romb d₁·d₂/2. log₃ 81 = 4, bo 3⁴ = 81.","A ≈ 28,27; B ≈ 27,71; C = 27,5; D = 28 → A. Kalendarz: 5 · 4 + 1 = 21. Kod: A21."]},{kind:"code",style:"letters",title:"Kufer z zamkiem szyfrowym",topic:"pola",answer:["A","2","1"],wheels:[zi,zt,zt],prompt:"Kufer ma zamek z trzema kółkami: litera, cyfra, cyfra.",hints:["Wiadomość zza książek mówi, czego potrzebujesz: obrazu i kalendarza.","Koło: π·(d/2)². Trapez: (a+b)·h/2. 15% = 0,15.","A = 0,96 m²; B ≈ 0,950 m²; C = 0,90 m²; D = 0,95 m² → A. Kalendarz: 0,15 · 140 = 21. Kod: A21."]})},globus:{bonus:!0,variants:G({kind:"number",title:"Schowek w globusie",topic:"jednostki",unit:"m",prompt:"Na karteczce w globusie: „Z biblioteki do rynku jest 2,5 km”. Ile to metrów?",answer:2500,hints:["Kilometr to tysiąc metrów.","2,5 km = 2,5 · 1000 m.","2500 m."]},{kind:"number",title:"Schowek w globusie",topic:"prawdopodobienstwo",prompt:"Na karteczce: „Rzucamy dwiema kostkami. Jakie jest prawdopodobieństwo, że suma oczek wyniesie 7?” Podaj ułamek (np. 1/6).",answer:1/6,tolerance:.001,hints:["Policz wszystkie możliwe wyniki rzutu dwiema kostkami.","|Ω| = 36. Wypisz pary dające sumę 7.","(1,6), (2,5), (3,4), (4,3), (5,2), (6,1) → 6/36 = 1/6."]},{kind:"number",title:"Schowek w globusie",topic:"statystyka",prompt:"Na karteczce: czas dojazdu bibliotekarki w kolejnych dniach (min): 12, 15, 18, 15, 20. Oblicz średnią arytmetyczną.",answer:16,hints:["Średnia = suma wartości / liczba wartości.","Suma: 12 + 15 + 18 + 15 + 20.","80 : 5 = 16 minut."]})},bezpieczniki:{variants:G({kind:"switches",title:"Skrzynka bezpieczników",topic:"dzialania",target:33,unit:"A",prompt:"Napis na skrzynce: „Aby włączyć światło, włącz bezpieczniki o łącznej wartości DOKŁADNIE 33 A”.",switches:[{label:"5 A",value:5},{label:"8 A",value:8},{label:"12 A",value:12},{label:"15 A",value:15},{label:"20 A",value:20}],hints:["Zacznij od największego bezpiecznika i sprawdź, ile brakuje do 33.","33 − 20 = 13. Które dwa bezpieczniki dają razem 13?","20 + 8 + 5 = 33 A."]},{kind:"switches",title:"Skrzynka bezpieczników",topic:"potegi",target:29,prompt:"Napis na skrzynce: „Włącz bezpieczniki, których wartości dają razem DOKŁADNIE 29”.",switches:[{label:"log₂ 32",value:5},{label:"√64",value:8},{label:"3!",value:6},{label:"2⁴",value:16},{label:"20 · sin 30°",value:10}],hints:["Najpierw oblicz wartość każdego opisu.","log₂ 32 = 5, √64 = 8, 3! = 6, 2⁴ = 16, sin 30° = 1/2.","Np. 16 + 8 + 5 = 29 (lub 5 + 8 + 6 + 10 = 29)."]},{kind:"switches",title:"Skrzynka bezpieczników",topic:"technika",target:2400,unit:"W",prompt:"Napis na skrzynce: „Włącz obwody o łącznej mocy DOKŁADNIE 2,4 kW”.",switches:[{label:"230 V · 2 A",value:460},{label:"0,75 kW",value:750},{label:"1,2 kW",value:1200},{label:"230 V · 5 A",value:1150},{label:"0,5 kW",value:500}],hints:["Wyraź moce w tej samej jednostce (W).","P = U · I; 1 kW = 1000 W. Moce: 460, 750, 1200, 1150, 500 W.","1150 + 750 + 500 = 2400 W = 2,4 kW."]})},zdjecie:{bonus:!0,variants:G({kind:"number",title:"Zdjęcie klasy 1926",topic:"ulamki",prompt:"Podpis: „W klasie było 28 uczniów, 3/7 stanowiły dziewczęta”. Ilu było chłopców?",answer:16,hints:["Najpierw policz dziewczęta.","3/7 z 28 = 28 : 7 · 3.","Dziewczęta: 12, chłopcy: 28 − 12 = 16."]},{kind:"number",title:"Zdjęcie klasy 1926",topic:"prawdopodobienstwo",prompt:"Podpis: „Z 6 kandydatów wybraliśmy przewodniczącego i zastępcę”. Na ile sposobów można było to zrobić?",answer:30,hints:["Kolejność ma znaczenie – to dwie różne funkcje.","Przewodniczący: 6 możliwości, zastępca: 5 pozostałych.","6 · 5 = 30 sposobów."]},{kind:"number",title:"Zdjęcie klasy 1926",topic:"proporcje",unit:"cm²",prompt:"Zdjęcie 10 cm × 15 cm powiększono w skali 3 : 1. Jakie pole (cm²) ma odbitka?",answer:1350,hints:["Skala 3 : 1 – każdy wymiar jest 3 razy większy.","Nowe wymiary: 30 cm × 45 cm.","30 · 45 = 1350 cm² (pole wzrasta 9 razy)."]})},wyjscie:{variants:G({kind:"code",style:"dials",title:"Zamek głównego wyjścia",topic:"rownania",answer:He("7523"),prompt:"Główne drzwi mają cztery pokrętła oznaczone kolejno symbolami ze ściany.",hints:["Potrzebujesz teczki z szafy archiwalnej (wartości symboli) i ściany z symbolami (kolejność).","Rozwiązuj po kolei: z pierwszego równania wyznacz ★, potem ●, ▲ i ■.","★ = 5, ● = 3, ▲ = 7, ■ = 2. Kolejność ▲ ★ ■ ● → 7523."]},{kind:"code",style:"dials",title:"Zamek głównego wyjścia",topic:"rownania",answer:He("3564"),prompt:"Główne drzwi mają cztery pokrętła oznaczone kolejno symbolami ze ściany.",hints:["Potrzebujesz teczki z szafy archiwalnej (wartości symboli) i ściany z symbolami (kolejność).","Układ: dodaj równania stronami. ▲² − 6▲ + 9 = (▲ − 3)². 64 = 2⁶.","★ = 5, ● = 4, ▲ = 3, ■ = 6. Kolejność ▲ ★ ■ ● → 3564."]},{kind:"code",style:"dials",title:"Zamek głównego wyjścia",topic:"technika",answer:He("3564"),prompt:"Główne drzwi mają cztery pokrętła oznaczone kolejno symbolami ze ściany.",hints:["Potrzebujesz teczki z szafy archiwalnej (wartości symboli) i ściany z symbolami (kolejność).","★ = 40 : 8; ● = 12 : 3; rabat = 9 zł z 300 zł; 1 l = 1000 cm³.","★ = 5, ● = 4, ▲ = 3%, ■ = 6 l. Kolejność ▲ ★ ■ ● → 3564."]})}},rooms:[{id:"klasa",name:"Sala lekcyjna",bg:"classroom",intro:b("Stara sala lekcyjna. Pachnie kredą i kurzem. Drzwi są zamknięte na klucz, a na tablicy widnieje zadanie."),objects:[{id:"k_tablica",name:"Tablica",art:"chalkboard",x:470,y:110,w:620,h:300,description:b("Na tablicy ktoś zapisał kredą zadanie. Pod spodem: „Wynik to początek drogi”."),lock:{type:"puzzle",puzzle:"tablica"},openedText:b("Pod Twoim rozwiązaniem pojawia się dopisek: „Dobrze! Ta liczba otwiera pierwszą zagadkę”."),onOpen:{clues:["tablica_wynik"]}},{id:"k_zegar",name:"Zegar ścienny",art:"clock",x:1170,y:60,w:130,h:130,description:b("Stary zegar z wahadłem. Stanął – wskazówki ani drgną. Pod spodem wyryto napis."),onOpen:{clues:["zegar"]}},{id:"k_plakat",name:"Plakat z planem szkoły",art:"poster",x:1170,y:230,w:200,h:250,description:b("Wyblakły plan szkoły z 1926 roku. W rogu ktoś dopisał ołówkiem zagadkę."),onOpen:{clues:["plakat"]}},{id:"k_okno",name:"Okno",art:"window",x:90,y:100,w:290,h:370,description:b("Za oknem zapada zmrok. Okno ma kraty – tędy nie wyjdziesz. Na parapecie leży kreda.")},{id:"k_plecak",name:"Porzucony plecak",art:"backpack",x:1210,y:640,w:140,h:170,description:b("Czyjś stary plecak. W bocznej kieszeni jest złożona karteczka."),onOpen:{clues:["notatka_plecak"]}},{id:"k_biurko",name:"Biurko nauczyciela",art:"desk",x:560,y:500,w:480,h:240,description:b("Masywne biurko. Szuflada ma zamek z trzema pokrętłami."),lock:{type:"puzzle",puzzle:"szuflada"},openedText:b("Szuflada jest otwarta i pusta."),onOpen:{items:["klucz_mosiezny"],message:b("Szuflada ustępuje z kliknięciem! W środku leży mosiężny klucz.")}},{id:"k_kosz",name:"Kosz na śmieci",art:"bin",x:420,y:690,w:90,h:120,secret:!0,description:b("W koszu leży zmięta kartka z jakimś zadaniem."),lock lf",x:1150,y:160,w:220,h:480,description:b("Stare dzienniki lekcyjne z lat 20. W jednym z nich ktoś zanotował: „Kalendarz to nie tylko daty – zapamiętaj zakreśloną liczbę”.")},{id:"p_powrot",name:"Drzwi do sali lekcyjnej",art:"door_side",x:10,y:180,w:90,h:500,description:b("Wejście z sali lekcyjnej."),door:{to:"klasa"}},{id:"p_drzwi",name:"Drzwi do biblioteki",art:"door_card",x:1400,y:130,w:180,h:570,description:b("Drzwi z elektronicznym czytnikiem kart."),lockedText:b("Czytnik świeci na czerwono. Potrzebna karta biblioteczna."),lock:{type:"item",item:"karta_biblio"},openedText:b("Czytnik zapalił się na zielono. Droga do biblioteki wolna."),door:{to:"biblioteka"}}]},{id:"biblioteka",name:"Biblioteka",bg:"library",intro:b("Biblioteka tonie w półmroku. Między regałami unosi się zapach starego papieru. W kącie stoi okuty kufer."),objects:[{id:"b_regal",name:"Regał z ponumerowanymi książkami",art:"bookshelf",x:70,y:110,w:430,h:570,description:b("Na środkowej półce stoi pięć książek z liczbami na grzbietach. Wyglądają na poprzestawiane."),lock:{type:"puzzle",puzzle:"regal"},openedText:b("Za książkami otworzyła się skrytka."),onOpen:{clues:["wiadomosc_regal"],message:b("Klik! Za książkami otwiera się skrytka z wiadomością.")}},{id:"b_obraz",name:"Obraz z figurami",art:"painting_shapes",x:620,y:100,w:340,h:260,description:b("Dziwny obraz w złotej ramie – same figury geometryczne."),onOpen:{clues:["obraz"]}},{id:"b_kronika",name:"Kronika szkoły",art:"open_book",x:720,y:540,w:300,h:150,description:b("Na pulpicie leży otwarta kronika szkoły."),onOpen:{clues:["kronika"]}},{id:"b_globus",name:"Globus",art:"globe",x:540,y:470,w:140,h:210,secret:!0,description:b("Globus ma szparę na równiku. W środku jest karteczka."),lock:{type:"puzzle",puzzle:"globus"},openedText:b("Zagadka z globusa rozwiązana.")},{id:"b_kufer",name:"Okuty kufer",art:"chest",x:1070,y:540,w:250,h:180,description:b("Stary kufer z zamkiem szyfrowym: litera i dwie cyfry."),lock:{type:"puzzle",puzzle:"kufer"},openedText:b("Kufer jest otwarty."),onOpen:{items:["klucz_piwnica"],message:b("Wieko kufra skrzypi. Na dnie leży żelazny klucz z przywieszką „Piwnica”.")}},{id:"b_lampa",name:"Lampa biurowa",art:"lamp",x:1090,y:330,w:110,h:170,description:b("Lampa z zielonym kloszem. Daje odrobinę światła – wystarczy do czytania.")},{id:"b_powrot",name:"Drzwi do pokoju nauczycielskiego",art:"door",x:1400,y:130,w:170,h:520,description:b("Powrót do pokoju nauczycielskiego."),door:{to:"pokoj"}},{id:"b_klapa",name:"Klapa do piwnicy",art:"hatch",x:1330,y:700,w:240,h:120,description:b("Drewniana klapa w podłodze z żelazną kłódką."),lockedText:b("Kłódka jest zamknięta. Potrzebny klucz."),lock:{type:"item",item:"klucz_piwnica"},openedText:b("Klapa uniesiona. Strome schody prowadzą do archiwum w piwnicy."),door:{to:"piwnica"}}]},{id:"piwnica",name:"Archiwum w piwnicy",bg:"basement",darkUntil:"swiatlo",intro:b("Piwnica jest prawie zupełnie ciemna. W świetle telefonu widać skrzynkę z bezpiecznikami i masywne drzwi – główne wyjście ewakuacyjne szkoły."),objects:[{id:"w_bezpieczniki",name:"Skrzynka bezpieczników",art:"fusebox",x:110,y:180,w:210,h:280,description:b("Stara skrzynka z pięcioma bezpiecznikami."),lock:{type:"puzzle",puzzle:"bezpieczniki"},openedText:b("Bezpieczniki włączone – w piwnicy pali się światło."),onOpen:{flags:["swiatlo"],message:b("Brzęczenie… i żarówki rozbłyskują! Teraz widać całą piwnicę.")}},{id:"w_szafa",name:"Szafa archiwalna",art:"archive",x:380,y:130,w:300,h:530,showIf:"swiatlo",description:b("Szafa pełna teczek. Jedna podpisana jest „Klasa 1926”."),onOpen:{clues:["teczka"],items:["zeszyt"]}},{id:"w_symbole",name:"Symbole na ścianie",art:"wall_symbols",x:760,y:120,w:400,h:150,showIf:"swiatlo",description:b("Dopiero w świetle widać symbole namalowane farbą nad drzwiami."),onOpen:{clues:["symbole"]}},{id:"w_zdjecie",name:"Stare zdjęcie klasy",art:"photo",x:1190,y:300,w:130,h:160,secret:!0,showIf:"swiatlo",description:b("Oprawione zdjęcie: Klasa 1926. Na odwrocie jest zagadka."),lock:{type:"puzzle",puzzle:"zdjecie"},openedText:b("Uczniowie na zdjęciu zdają się uśmiechać.")},{id:"w_skrzynia",name:"Drewniana skrzynia",art:"crate",x:860,y:620,w:220,h:160,description:b("Skrzynia pełna pustych słoików po konfiturach. Nic przydatnego.")},{id:"w_schody",name:"Schody do biblioteki",art:"stairs",x:60,y:520,w:300,h:330,description:b("Schody prowadzą z powrotem do biblioteki."),door:{to:"biblioteka"}},{id:"w_wyjscie",name:"Główne wyjście",art:"exit_dials",x:1340,y:110,w:240,h:610,description:b("Masywne stalowe drzwi z czterema pokrętłami. Nad nimi napis: WYJŚCIE."),lock:{type:"puzzle",puzzle:"wyjscie"},openedText:b("Drzwi stoją otworem. Czuć świeże powietrze!"),door:{exit:!0}}]}]},Jp={id:"piramida",title:"Sekret Egipskiej Piramidy",subtitle:"Rozdział II – Liczby faraonów",description:"Ekspedycja archeologiczna zamienia się w pułapkę: kamienna brama piramidy zamyka się za Tobą. Starożytni kapłani zostawili zagadki – rozwiąż je, by zobaczyć słońce.",theme:"egypt",difficulty:2,levels:["sp","lo","tech"],startRoom:"wejscie",intro:b("Zeszyt Klasy 1926 zaprowadził Cię do Egiptu. Przekraczasz próg piramidy razem z ekspedycją… i nagle słyszysz huk. Kamienna brama zamyka się za Tobą, odcinając drogę powrotu. W świetle pochodni na ścianie widać znaki – kapłani faraona najwyraźniej przewidzieli gości."),ending:b("Płyty ołtarza zapadają się jedna po drugiej, a Brama Słońca otwiera się z łoskotem. Oślepia Cię blask pustynnego słońca. Kierownik ekspedycji nie może uwierzyć: „Rozszyfrowałeś mechanizm, którego nikt nie rozumiał od czterech tysięcy lat!”. W zeszycie Klasy 1926 pojawia się nowa strona: szkic laboratorium…"),reward:{badge:"🔺",title:"Strażnik Piramidy"},items:{pochodnia:{name:"Pochodnia",icon:"🔥",description:"Płonąca pochodnia. Rozjaśni ciemne zakamarki."},skarabeusz:{name:"Złoty skarabeusz",icon:"🪲",description:"Złota figurka skarabeusza. Pasuje do jakiegoś wgłębienia."},klucz_ra:{name:"Klucz Ra",icon:"☀️",description:"Klucz w kształcie słońca z promieniami."}},clues:{legenda:{title:"Legenda liczb egipskich",text:b("Gliniana tabliczka objaśnia znaki: kreska = 1, pałąk = 10, zwój liny = 100, kwiat lotosu = 1000. Egipcjanie zapisywali liczbę, powtarzając znaki i dodając ich wartości."),visual:b({type:"egyptLegend"})},posag:{title:"Tabliczki posągu Anubisa",text:G("Posąg trzyma dwie tabliczki z liczbami. Pod spodem: „Kod przejścia to SUMA obu liczb”.","Na tabliczce kapłani zapisali trzy pierwsze wyrazy ciągu geometrycznego. Pod spodem: „Kod przejścia to SUMA PIĘCIU pierwszych wyrazów tego ciągu”.","Tabliczka to rejestr spichlerza: liczba worków zboża. „Co miesiąc zużywa się 12% POCZĄTKOWEGO zapasu. Kod przejścia to liczba worków po 3 miesiącach”."),visual:G({type:"egypt",numbers:[1243,135]},{type:"egypt",numbers:[3,12,48]},{type:"egypt",numbers:[2500]})},papirus:{title:"Papirus kapłana",text:G("„Ustaw symbole skrzyni: PIERWSZY – figura o 4 równych bokach i 4 kątach prostych. DRUGI – figura, której suma kątów wynosi 180°. TRZECI – figura bez wierzchołków.”","„Ustaw symbole skrzyni: PIERWSZY – wielokąt foremny o kącie wewnętrznym 120°. DRUGI – wielokąt foremny mający dokładnie 5 przekątnych. TRZECI – wielokąt foremny o sumie kątów wewnętrznych 360°.”","„Ustaw symbole skrzyni (przekroje prętów): PIERWSZY – przekrój o polu ≈ 3,14 cm² przy wymiarze 2 cm (średnica). DRUGI – foremny profil o obwodzie 15 cm przy boku 3 cm. TRZECI – profil o polu a²√3/4.”"),visual:b({type:"symbols",items:["tri","sq","pent","hex","circ"],caption:"symbole na kołach skrzyni"})},model_wynik:{title:"Liczba z modelu piramidy",text:b("Model piramidy skrywa liczbę 60.")},inskrypcja:{title:"Inskrypcja nad sarkofagiem",text:G("„Kod sarkofagu: dwie pierwsze cyfry to liczba z modelu piramidy, ostatnia – liczba WIERZCHOŁKÓW ostrosłupa czworokątnego.”","„Kod sarkofagu: dwie pierwsze cyfry to liczba z modelu piramidy, ostatnia – liczba KRAWĘDZI ostrosłupa czworokątnego.”","„Kod sarkofagu: dwie pierwsze cyfry to liczba z modelu piramidy, ostatnia – liczba wszystkich ŚCIAN ostrosłupa czworokątnego (z podstawą).”")},gwiazdy:{title:"Mapa gwiazd",text:G("Między gwiazdami wyryto: „Płyty ołtarza muszą dać razem 25% ze 120”.","Między gwiazdami wyryto: „Płyty ołtarza muszą dać razem NAJMNIEJSZĄ wartość funkcji f(x) = x² − 8x + 46”.","Między gwiazdami wyryto wysokości wylewów Nilu (łokcie): 22, 35, 30, 41, 28. „Płyty ołtarza muszą dać razem MEDIANĘ tych danych”.")},klepsydra:{title:"Klepsydra",text:b("Na klepsydrze: „Czas płynie jak piasek – ale mądry nie spieszy się z liczeniem”.")}},puzzles:{przejscie:{variants:G({kind:"code",style:"dials",title:"Kamienne przejście",topic:"systemy_liczbowe",answer:He("1378"),prompt:"Kamienne przejście ma cztery obrotowe pierścienie z cyframi.",hints:["Odczytaj obie liczby z tabliczek posągu – legenda znaków jest na glinianej tabliczce.","Policz znaki każdego rodzaju: lotosy (tysiące), zwoje (setki), pałąki (dziesiątki), kreski (jedności).","Tabliczki: 1243 i 135. Suma: 1243 + 135 = 1378."]},{kind:"code",style:"dials",title:"Kamienne przejście",topic:"ciagi",answer:He("1023"),prompt:"Kamienne przejście ma cztery obrotowe pierścienie z cyframi.",hints:["Odczytaj liczby z tabliczki – legenda znaków jest na glinianej tabliczce.","Ciąg 3, 12, 48: iloraz q = 4. Sₙ = a₁ · (qⁿ − 1)/(q − 1).","S₅ = 3 · (4⁵ − 1)/3 = 1024 − 1 = 1023 (3 + 12 + 48 + 192 + 768)."]},{kind:"code",style:"dials",title:"Kamienne przejście",topic:"procenty",answer:He("1600"),prompt:"Kamienne przejście ma cztery obrotowe pierścienie z cyframi.",hints:["Odczytaj zapas zboża z tabliczki – legenda znaków jest na glinianej tabliczce.","Tabliczka: 2 lotosy i 5 zwojów. 12% liczysz zawsze od zapasu początkowego.","2500 worków; 12% · 2500 = 300 miesięcznie; 2500 − 3 · 300 = 1600."]})},mozaika:{bonus:!0,variants:G({kind:"number",title:"Mozaika na posadzce",topic:"dzialania",prompt:"Mozaika ma 7 rzędów po 9 płytek, ale 15 płytek wypadło. Ile płytek zostało?",answer:48,hints:["Policz najpierw wszystkie płytki.","7 · 9 = 63.","63 − 15 = 48."]},{kind:"number",title:"Mozaika na posadzce",topic:"geometria",prompt:"Mozaika ma kształt ośmiokąta foremnego. Ile przekątnych ma ośmiokąt?",answer:20,hints:["Z każdego wierzchołka wychodzą przekątne do niesąsiednich wierzchołków.","Liczba przekątnych n-kąta: n(n − 3)/2.","8 · 5 / 2 = 20."]},{kind:"number",title:"Mozaika na posadzce",topic:"jednostki",unit:"szt.",prompt:"Płytka ma wymiary 20 cm × 20 cm. Ile płytek potrzeba na posadzkę 3 m × 2,4 m (bez zapasu)?",answer:180,hints:["Porównaj pole posadzki z polem jednej płytki – w tych samych jednostkach.","3 m × 2,4 m = 300 cm × 240 cm; płytka: 400 cm².","72 000 : 400 = 180 płytek."]})},sciana:{variants:G({kind:"number",title:"Ściana hieroglifów",topic:"ciagi",prompt:"Na ścianie wyryto ciąg: 2, 5, 11, 23, 47, … Jaka liczba jest następna?",answer:95,hints:["Sprawdź, jak z jednej liczby powstaje następna.","Spróbuj: pomnóż przez 2 i coś dodaj.","Reguła: ×2 + 1. 47 · 2 + 1 = 95."]},{kind:"number",title:"Ściana hieroglifów",topic:"ciagi",prompt:"Ściana opisuje ciąg arytmetyczny: a₃ = 11, a₇ = 27. Oblicz a₁₂.",answer:47,hints:["Między a₃ a a₇ są 4 „kroki” ciągu.","4r = 27 − 11, więc r = 4. Potem a₁ = a₃ − 2r.","r = 4, a₁ = 3, a₁₂ = 3 + 11 · 4 = 47."]},{kind:"number",title:"Ściana hieroglifów",topic:"ciagi",unit:"szt.",prompt:"Budowniczowie produkowali w 1. tygodniu 4000 cegieł, a co tydzień o 5% więcej niż w poprzednim. Ile cegieł wyprodukowano w 3. tygodniu?",answer:4410,hints:["To ciąg geometryczny – każdy tydzień to poprzedni ·1,05.","a₃ = a₁ · q², q = 1,05.","4000 · 1,05² = 4000 · 1,1025 = 4410."]})},waga:{bonus:!0,variants:G({kind:"number",title:"Waga kapłanów",topic:"proporcje",unit:"g",prompt:"Na wadze: 3 dzbany oliwy równoważą 2 worki ziarna. Worek waży 150 g (to model!). Ile waży jeden dzban?",answer:100,hints:["Policz, ile ważą oba worki razem.","2 · 150 = 300 g – tyle ważą 3 dzbany.","300 : 3 = 100 g."]},{kind:"number",title:"Waga kapłanów",topic:"proporcje",prompt:"Masa m kamienia spełnia proporcję m : 12 = 15 : 4. Oblicz m.",answer:45,hints:["W proporcji iloczyn wyrazów skrajnych = iloczyn wyrazów środkowych.","4m = 12 · 15.","m = 180 : 4 = 45."]},{kind:"number",title:"Waga kapłanów",topic:"proporcje",unit:"kg",prompt:"Brąz to stop miedzi i cyny w stosunku 4 : 1. Ile kg miedzi jest w 35 kg brązu?",answer:28,hints:["Stop składa się z 4 + 1 = 5 równych części.","Jedna część = 35 : 5 kg.","7 kg · 4 = 28 kg miedzi."]})},skrzynia:{variants:G({kind:"code",style:"symbols",title:"Skrzynia z symbolami",topic:"geometria",answer:["sq","tri","circ"],wheels:[Xt,Xt,Xt],prompt:"Skrzynia ma trzy koła z symbolami figur. Ustaw je zgodnie z papirusem.",hints:["Wskazówka jest na papirusie ukrytym za ścianą hieroglifów.","Trójkąt ma sumę kątów 180°, kwadrat ma 4 równe boki i kąty proste.","Kwadrat, trójkąt, koło."]},{kind:"code",style:"symbols",title:"Skrzynia z symbolami",topic:"geometria",answer:["hex","pent","sq"],wheels:[Xt,Xt,Xt],prompt:"Skrzynia ma trzy koła z symbolami figur. Ustaw je zgodnie z papirusem.",hints:["Wskazówka jest na papirusie ukrytym za ścianą hieroglifów.","Kąt n-kąta foremnego: (n − 2)·180°/n. Przekątne: n(n − 3)/2. Suma kątów: (n − 2)·180°.","120° → sześciokąt; 5 przekątnych → pięciokąt; 360° → kwadrat."]},{kind:"code",style:"symbols",title:"Skrzynia z symbolami",topic:"pola",answer:["circ","pent","tri"],wheels:[Xt,Xt,Xt],prompt:"Skrzynia ma trzy koła z symbolami figur. Ustaw je zgodnie z papirusem.",hints:["Wskazówka jest na papirusie ukrytym za ścianą hieroglifów.","Koło o średnicy 2 cm: π · 1² ≈ 3,14. 15 : 3 = 5 boków. a²√3/4 to pole trójkąta równobocznego.","Koło, pięciokąt, trójkąt."]})},model:{variants:G({kind:"number",title:"Model piramidy",topic:"bryly",unit:"dm³",prompt:"Model stoi na postumencie w kształcie prostopadłościanu 5 dm × 4 dm × 3 dm. Oblicz objętość postumentu (dm³).",answer:60,hints:["Objętość prostopadłościanu zależy od trzech wymiarów.","V = a · b · c.","5 · 4 · 3 = 60 dm³."]},{kind:"number",title:"Model piramidy",topic:"bryly",prompt:"Model to ostrosłup prawidłowy czworokątny: krawędź podstawy 6, wysokość bryły 4. Oblicz pole powierzchni bocznej.",answer:60,hints:["Potrzebujesz wysokości ściany bocznej (h).","h² = H² + (a/2)² = 4² + 3². Ściana boczna to trójkąt o polu a · h / 2.","h = 5; jedna ściana: 6 · 5 / 2 = 15; cztery ściany: 60."]},{kind:"number",title:"Model piramidy",topic:"bryly",unit:"m³",prompt:"Model w skali przedstawia ostrosłup o podstawie kwadratu 6 m × 6 m i wysokości 5 m. Ile m³ kamienia potrzeba na jego wykonanie?",answer:60,hints:["Ostrosłup ma objętość mniejszą niż prostopadłościan o tej samej podstawie i wysokości.","V = 1/3 · Pp · H.","1/3 · 36 · 5 = 60 m³."]})},figury:{variants:G({kind:"match",title:"Ściana figur",topic:"pola",prompt:"Dopasuj każdą figurę do jej pola.",pairs:[["kwadrat o boku 4","16"],["prostokąt 3 × 5","15"],["trójkąt: podstawa 6, wysokość 4","12"],["równoległobok: bok 7, wysokość 2","14"]],hints:["Każda figura ma inny wzór na pole.","Kwadrat a², prostokąt a·b, trójkąt a·h/2, równoległobok a·h.","16, 15, 12, 14."]},{kind:"match",title:"Ściana figur",topic:"bryly",prompt:"Dopasuj każdą bryłę do wzoru na jej objętość.",pairs:[["kula","4/3 · πr³"],["stożek","1/3 · πr²h"],["walec","πr²h"],["ostrosłup","1/3 · Pp · H"]],hints:["Stożek i ostrosłup to „szpiczaste” bryły – ich objętość ma czynnik 1/3.","Walec to graniastosłup o podstawie koła; stożek to „ostrosłup” o podstawie koła.","Kula – 4/3πr³, stożek – 1/3πr²h, walec – πr²h, ostrosłup – 1/3·Pp·H."]},{kind:"match",title:"Ściana figur",topic:"jednostki",prompt:"Dopasuj jednostki do ich odpowiedników.",pairs:[["1 m³","1000 l"],["1 ha","10 000 m²"],["1 l","1 dm³"],["1 m/s","3,6 km/h"]],hints:["Zastanów się, jak duży jest każdy obiekt (sześcian o boku 1 m, kwadrat 100 m × 100 m…).","1 m³ = 1000 dm³; 1 ha = 100 m · 100 m; 1 h = 3600 s.","1 m³ = 1000 l, 1 ha = 10 000 m², 1 l = 1 dm³, 1 m/s = 3,6 km/h."]})},plyty:{bonus:!0,variants:G({kind:"number",title:"Płyty posadzki",topic:"pola",unit:"szt.",prompt:"Płyty mają wymiary 30 cm × 30 cm. Ile płyt pokrywa podłogę 3 m × 1,8 m?",answer:60,hints:["Policz, ile płyt mieści się wzdłuż każdego boku.","300 : 30 = 10 płyt i 180 : 30 = 6 płyt.","10 · 6 = 60 płyt."]},{kind:"number",title:"Płyty posadzki",topic:"geometria",unit:"°",prompt:"Płyty mają kształt sześciokątów foremnych. Ile stopni ma kąt wewnętrzny takiej płyty?",answer:120,hints:["Suma kątów n-kąta: (n − 2) · 180°.","Sześciokąt: 4 · 180° = 720°, kąty są równe.","720° : 6 = 120°."]},{kind:"number",title:"Płyty posadzki",topic:"finanse",unit:"zł",prompt:"Odnowienie 15 m² posadzki: płytki po 80 zł/m², kupujemy 10% zapasu. Ile kosztują płytki?",answer:1320,hints:["Zapas zwiększa potrzebną powierzchnię.","15 m² · 1,1 = 16,5 m².","16,5 · 80 = 1320 zł."]})},sarkofag:{variants:G({kind:"code",style:"dials",title:"Sarkofag",topic:"bryly",answer:He("605"),prompt:"Wieko sarkofagu blokują trzy kamienne pierścienie.",hints:["Przeczytaj inskrypcję nad sarkofagiem i rozwiąż zagadkę modelu piramidy.","Ostrosłup czworokątny: 4 wierzchołki podstawy + wierzchołek na górze.","60 i 5 wierzchołków → 605."]},{kind:"code",style:"dials",title:"Sarkofag",topic:"bryly",answer:He("608"),prompt:"Wieko sarkofagu blokują trzy kamienne pierścienie.",hints:["Przeczytaj inskrypcję nad sarkofagiem i rozwiąż zagadkę modelu piramidy.","Ostrosłup czworokątny: 4 krawędzie podstawy + 4 krawędzie boczne.","60 i 8 krawędzi → 608."]},{kind:"code",style:"dials",title:"Sarkofag",topic:"bryly",answer:He("605"),prompt:"Wieko sarkofagu blokują trzy kamienne pierścienie.",hints:["Przeczytaj inskrypcję nad sarkofagiem i rozwiąż zagadkę modelu piramidy.","Ostrosłup czworokątny: 1 podstawa + 4 ściany boczne.","60 i 5 ścian → 605."]})},oltarz:{variants:G({kind:"switches",title:"Ołtarz z płytami",topic:"procenty",target:30,prompt:"Na ołtarzu jest sześć płyt z liczbami. Wciśnij płyty, których suma jest równa liczbie z mapy gwiazd.",switches:[{label:"5",value:5},{label:"8",value:8},{label:"10",value:10},{label:"12",value:12},{label:"15",value:15},{label:"17",value:17}],hints:["Najpierw rozwiąż zagadkę z mapy gwiazd.","25% to jedna czwarta. 120 : 4 = ?","Liczba to 30, np. 5 + 10 + 15 = 30 albo 8 + 5 + 17 = 30."]},{kind:"switches",title:"Ołtarz z płytami",topic:"funkcje",target:30,prompt:"Na ołtarzu jest sześć płyt z wyrażeniami. Wciśnij płyty, których suma wartości jest równa liczbie z mapy gwiazd.",switches:[{label:"2³",value:8},{label:"√49",value:7},{label:"log₅ 125",value:3},{label:"|−12|",value:12},{label:"(5 nad 2)",value:10},{label:"3!",value:6}],hints:["Najpierw znajdź wartość najmniejszą funkcji kwadratowej z mapy gwiazd.","Dla a > 0 najmniejsza wartość jest w wierzchołku: p = −b/(2a) = 4, q = f(4).","f(4) = 16 − 32 + 46 = 30. Np. 8 + 12 + 10 = 30."]},{kind:"switches",title:"Ołtarz z płytami",topic:"statystyka",target:30,prompt:"Na ołtarzu jest sześć płyt z obliczeniami. Wciśnij płyty, których suma wartości jest równa liczbie z mapy gwiazd.",switches:[{label:"15% z 60",value:9},{label:"0,25 · 48",value:12},{label:"3,6 km/h w m/s",value:1},{label:"1/4 z 32",value:8},{label:"2,5 m w dm",value:25},{label:"120 min w h",value:2}],hints:["Najpierw oblicz medianę danych z mapy gwiazd – uporządkuj je!","22, 28, 30, 35, 41 – mediana to środkowa wartość. Wartości płyt: 9, 12, 1, 8, 25, 2.","Mediana = 30. Np. 9 + 12 + 8 + 1 = 30."]})},skarb:{bonus:!0,variants:G({kind:"number",title:"Skarbiec faraona",topic:"statystyka",prompt:"W pięciu szkatułach jest 12, 15, 9, 20 i 14 złotych monet. Ile monet jest średnio w szkatule?",answer:14,hints:["Średnia to suma podzielona przez liczbę szkatuł.","12 + 15 + 9 + 20 + 14 = 70.","70 : 5 = 14 monet."]},{kind:"number",title:"Skarbiec faraona",topic:"prawdopodobienstwo",prompt:"W szkatule jest 5 złotych i 3 srebrne monety. Losujemy 2 monety naraz. Oblicz prawdopodobieństwo, że obie są złote (ułamek).",answer:5/14,tolerance:.001,hints:["Policz wszystkie możliwe pary monet i pary złotych monet.","|Ω| = (8 nad 2) = 28; |A| = (5 nad 2) = 10.","P = 10/28 = 5/14."]},{kind:"number",title:"Skarbiec faraona",topic:"jednostki",unit:"g",prompt:"1 uncja trojańska złota to 31,1 g. Ile gramów ma 20 uncji?",answer:622,hints:["Pomnóż masę jednej uncji przez liczbę uncji.","31,1 · 20.","622 g."]})}},rooms:[{id:"wejscie",name:"Komnata wejściowa",bg:"egypt_entrance",intro:b("Komnata wejściowa. Za plecami – zamknięta brama. Przed Tobą posąg Anubisa i kamienne przejście z obrotowymi pierścieniami."),objects:[{id:"e_brama",name:"Kamienna brama",art:"stone_gate",x:40,y:120,w:300,h:590,description:b("Brama, którą wszedłeś. Zamknięta na głucho – trzeba znaleźć inne wyjście.")},{id:"e_posag",name:"Posąg Anubisa",art:"statue",x:400,y:120,w:200,h:580,description:b("Posąg boga Anubisa trzyma tabliczki z dziwnymi znakami."),onOpen:{clues:["posag"]}},{id:"e_pochodnia",name:"Pochodnia",art:"torch",x:690,y:170,w:80,h:210,description:b("Pochodnia osadzona w uchwycie. Wciąż płonie."),openedText:b("Pusty uchwyt na pochodnię."),onOpen:{items:["pochodnia"],message:b("Wyjmujesz pochodnię z uchwytu. Przyda się w ciemności.")}},{id:"e_tabliczka",name:"Gliniana tabliczka",art:"clay_tablet",x:680,y:560,w:210,h:130,description:b("Tabliczka z rysunkami znaków i liczbami – jak słownik!"),onOpen:{clues:["legenda"]}},{id:"e_urna",name:"Urna",art:"urn",x:960,y:480,w:120,h:210,description:b("Gliniana urna z malowidłem łodzi na Nilu. Pusta.")},{id:"e_mozaika",name:"Mozaika w posadzce",art:"mosaic",x:880,y:740,w:300,h:110,secret:!0,description:b("Pod piaskiem kryje się mozaika. Brakuje w niej części płytek."),lock:{type:"puzzle",puzzle:"mozaika"},openedText:b("Mozaika rozszyfrowana.")},{id:"e_przejscie",name:"Kamienne przejście",art:"stone_door_dials",x:1250,y:110,w:310,h:600,description:b("Przejście zablokowane płytą z czterema obrotowymi pierścieniami cyfr."),lock:{type:"puzzle",puzzle:"przejscie"},openedText:b("Płyta zsunęła się w bok. Za nią ciemny korytarz do Sali hieroglifów."),door:{to:"hieroglify"}}]},{id:"hieroglify",name:"Sala hieroglifów",bg:"egypt_hieroglyphs",darkUntil:"oswietlone",intro:b("Sala hieroglifów tonie w mroku. W głębi widać ciemną niszę, a przy przeciwległej ścianie – wrota z wgłębieniem w kształcie żuka."),objects:[{id:"h_nisza",name:"Ciemna nisza",art:"niche",x:520,y:140,w:340,h:430,description:b("Zupełnie ciemna nisza. Bez światła nic tu nie zobaczysz."),lockedText:b("Za ciemno. Przydałoby się źródło światła."),lock:{type:"item",item:"pochodnia"},openedText:b("Pochodnia oświetla niszę i sąsiednią ścianę pełną hieroglifów."),onOpen:{flags:["oswietlone"],message:b("Ogień pochodni wydobywa z mroku ścianę pokrytą hieroglifami!")}},{id:"h_sciana",name:"Ściana hieroglifów",art:"hieroglyph_wall",x:90,y:110,w:370,h:390,showIf:"oswietlone",description:b("Rzędy znaków układają się w ciąg liczb. Jednego brakuje."),lock:{type:"puzzle",puzzle:"sciana"},openedText:b("Wciśnięty kamień otworzył skrytkę w niszy."),onOpen:{flags:["skrytka"],message:b("Wciskasz właściwy znak… W niszy coś zgrzyta i otwiera się skrytka!")}},{id:"h_papirus",name:"Papirus",art:"papyrus",x:600,y:350,w:190,h:140,showIf:"skrytka",description:b("Zwinięty papirus kapłana."),onOpen:{clues:["papirus"]}},{id:"h_skrzynia",name:"Skrzynia z symbolami",art:"egypt_chest",x:910,y:520,w:270,h:190,description:b("Malowana skrzynia z trzema kołami symboli figur."),lock:{type:"puzzle",puzzle:"skrzynia"},openedText:b("Skrzynia otwarta."),onOpen:{items:["skarabeusz"],message:b("Wieko unosi się. W środku błyszczy złoty skarabeusz!")}},{id:"h_waga",name:"Waga kapłanów",art:"balance",x:940,y:210,w:200,h:230,secret:!0,description:b("Brązowa waga z szalkami. Obok wyryto zadanie."),lock:{type:"puzzle",puzzle:"waga"},openedText:b("Szalki są w równowadze.")},{id:"h_powrot",name:"Korytarz do komnaty wejściowej",art:"passage_side",x:10,y:190,w:70,h:500,description:b("Powrót do komnaty wejściowej."),door:{to:"wejscie"}},{id:"h_wrota",name:"Wrota skarabeusza",art:"scarab_door",x:1250,y:110,w:310,h:600,description:b("Kamienne wrota z wgłębieniem w kształcie skarabeusza."),lockedTex 0×. Cyfra = rzeczywisty rozmiar komórki w mikrometrach (μm)”.")},tablica:{title:"Tablica magnetyczna",text:G("Na tablicy zapisano: „Cyfra = x, jeśli x : 4 = 2”.","Na tablicy zapisano: „f(x) = 2x − 3. Cyfra = argument, dla którego f(x) = 13”.","Na tablicy zapisano: „Cyfra = energia (kWh) zużyta przez urządzenie o mocy 2 kW pracujące 4 h”.")},tabela:{title:"Monitor z tabelą próbek",text:G("„LITERA hasła drzwi magazynu = próbka, której temperatura jest równa ŚREDNIEJ temperaturze wszystkich próbek.”","„LITERA hasła drzwi magazynu = próbka, dla której wartość f(x) = x² − 6x + 10 jest NAJMNIEJSZA.”","„LITERA hasła drzwi magazynu = linia produkcyjna o NAJWIĘKSZEJ wydajności (szt./h).”"),visual:G({type:"table",title:"Temperatura próbek",headers:["Próbka","A","B","C","D","E"],rows:[["°C",12,18,9,15,21]]},{type:"table",title:"Próbki – parametr x",headers:["Próbka","A","B","C","D","E"],rows:[["x",1,2,3,4,5]]},{type:"table",title:"Linie produkcyjne",headers:["Linia","A","B","C","D","E"],rows:[["sztuki",480,350,420,300,540],["czas pracy (h)",8,5,7,4,9]]})},wydruk:{title:"Wydruk z drukarki",text:G("„LICZBA w haśle drzwi magazynu = obwód prostokąta o bokach 15 i 6.”","„LICZBA w haśle drzwi magazynu = suma sześciu pierwszych wyrazów ciągu 2, 4, 6, 8, …”","„LICZBA w haśle drzwi magazynu = 35% ze 120.”")},lista:{title:"Lista inwentarzowa",text:b("„Kluczyk do skrzynki narzędziowej jest w mechanizmie regału. Regał zwolni blokadę, gdy pudła staną w odpowiedniej kolejności (patrz etykiety).”")},wykres_mocy:{title:"Ekran zużycia energii",text:G("„Pierwsza cyfra kodu konsoli = zużycie (kW) modułu, który zużywa NAJMNIEJ energii.”","„Pierwsza cyfra kodu konsoli = MIEJSCE ZEROWE funkcji liniowej z wykresu.”","„Pierwsza cyfra kodu konsoli = liczba miesięcy, w których koszt energii PRZEKROCZYŁ 400 zł.”"),visual:G({type:"bars",title:"Zużycie modułów (kW)",labels:["A","B","C","D"],values:[6,3,8,5],unit:"kW"},{type:"line",title:"Charakterystyka generatora",xLabel:"x",yLabel:"y",points:[[0,-6],[1,-4],[2,-2],[3,0],[4,2]],connect:!0,extend:!0,xRange:[-2,6],yRange:[-8,4],grid:!0},{type:"bars",title:"Koszt energii (zł)",labels:["I","II","III","IV","V"],values:[350,420,380,450,410],unit:"zł"})},dziennik:{title:"Dziennik awarii",text:G("„Kod konsoli to X, Y, Z. X – z ekranu zużycia. Y = (X + 9) : 2. Z = Y − X + 2.”","„Kod konsoli to X, Y, Z. X – z ekranu. Y = log₂ 64. Z spełnia równanie 2Z − Y = 4.”","„Kod konsoli to X, Y, Z. X – z ekranu kosztów. Y = moc (kW) odbiornika 230 V, 26 A, zaokrąglona do całości. Z = wydajność pompy w l/min, jeśli 300 l pompuje w godzinę.”")}},puzzles:{zlewki:{variants:G({kind:"number",title:"Zlewki z roztworem",topic:"proporcje",unit:"ml",prompt:"Instrukcja: „Mieszaj 2 części koncentratu z 3 częściami wody”. Ile ml koncentratu trzeba dodać do 60 ml wody?",answer:40,hints:["Stosunek koncentratu do wody ma być stały: 2 : 3.","60 ml wody to 3 części – ile ml ma jedna część?","60 : 3 = 20 ml; 2 · 20 = 40 ml."]},{kind:"number",title:"Zlewki z roztworem",topic:"procenty",unit:"g",prompt:"Ile gramów soli trzeba rozpuścić w 160 g wody, aby otrzymać roztwór o stężeniu 20%?",answer:40,hints:["Stężenie = masa substancji / masa CAŁEGO roztworu.","s / (s + 160) = 0,2.","s = 0,2s + 32 → 0,8s = 32 → s = 40 g."]},{kind:"number",title:"Zlewki z roztworem",topic:"procenty",unit:"l",prompt:"Ile litrów koncentratu o stężeniu 25% potrzeba, aby po rozcieńczeniu wodą otrzymać 100 l roztworu 10%?",answer:40,hints:["Woda nie zmienia ilości czystej substancji.","Czysta substancja w gotowym roztworze: 10% · 100 l = 10 l.","0,25 · x = 10 → x = 40 l."]})},szafka:{variants:b({kind:"code",style:"keypad",title:"Szafka z odczynnikami",topic:"logika",answer:He("4078"),prompt:"Elektroniczny zamek szafki: 4 cyfry.",hints:["Notatnik laboranta mówi, skąd pochodzą cyfry i w jakiej kolejności.","Zlewki dają liczbę dwucyfrową, mikroskop i tablica – po jednej cyfrze.","Zlewki: 40, mikroskop: 7, tablica: 8 → 4078."]})},robot:{bonus:!0,variants:G({kind:"number",title:"Robot sprzątający",topic:"pola",unit:"m",prompt:"Robot przejechał 3 okrążenia wokół prostokątnego stołu 4 m × 6 m. Ile metrów przejechał?",answer:60,hints:["Jedno okrążenie to obwód prostokąta.","Obw = 2 · (4 + 6) = 20 m.","3 · 20 = 60 m."]},{kind:"number",title:"Robot sprzątający",topic:"trygonometria",unit:"m",prompt:"Robot przejechał 10 m po prostej nachylonej pod kątem 30° do ściany. O ile metrów oddalił się od ściany?",answer:5,hints:["Narysuj trójkąt prostokątny: droga robota to przeciwprostokątna.","Odległość od ściany leży naprzeciw kąta 30°: d = 10 · sin 30°.","d = 10 · 1/2 = 5 m."]},{kind:"number",title:"Robot sprzątający",topic:"technika",unit:"min",prompt:"Akumulator robota ma pojemność 5 Ah, a robot pobiera prąd 2 A. Ile minut może pracować?",answer:150,hints:["Czas pracy = pojemność / natężenie prądu.","5 Ah : 2 A = 2,5 h.","2,5 h = 150 min."]})},serwery:{variants:G({kind:"switches",title:"Szafa serwerowa",topic:"dzialania",target:500,unit:"W",prompt:"Zasilanie awaryjne wytrzyma DOKŁADNIE 500 W. Włącz serwery, których łączny pobór to 500 W.",switches:[{label:"120 W",value:120},{label:"250 W",value:250},{label:"80 W",value:80},{label:"300 W",value:300},{label:"150 W",value:150}],hints:["Spróbuj zacząć od największego serwera.","500 − 300 = 200. Które serwery dają razem 200 W?","300 + 120 + 80 = 500 W."]},{kind:"switches",title:"Szafa serwerowa",topic:"funkcje",target:20,prompt:"Obciążenia serwerów opisano wyrażeniami. Włącz serwery o łącznym obciążeniu DOKŁADNIE 20.",switches:[{label:"f(2), f(x) = x² + 1",value:5},{label:"log 1000",value:3},{label:"a₄ ciągu 2, 4, 8, …",value:16},{label:"|−7|",value:7},{label:"sin²x + cos²x",value:1}],hints:["Oblicz wartość każdego wyrażenia.","f(2) = 5, log 1000 = 3, a₄ = 16, |−7| = 7, sin²x + cos²x = 1.","16 + 3 + 1 = 20."]},{kind:"switches",title:"Szafa serwerowa",topic:"jednostki",target:1600,unit:"W",prompt:"Zasilacz awaryjny ma moc 1,6 kW. Włącz serwery o łącznym poborze DOKŁADNIE 1,6 kW.",switches:[{label:"0,4 kW",value:400},{label:"250 W",value:250},{label:"1,1 kW",value:1100},{label:"350 W",value:350},{label:"0,6 kW",value:600}],hints:["Przelicz wszystko na waty.","400, 250, 1100, 350, 600 W; cel: 1600 W.","400 + 250 + 350 + 600 = 1600 W."]})},terminal:{variants:G({kind:"choice",title:"Terminal – wykres temperatury",topic:"wykresy",prompt:"Terminal pyta: „O której godzinie temperatura w komorze była NAJWYŻSZA?”",visual:{type:"line",title:"Temperatura w komorze (°C)",xLabel:"godzina",yLabel:"°C",points:[[8,18],[10,22],[12,27],[14,25],[16,21]],connect:!0,xRange:[7,17],yRange:[0,30],grid:!0},options:["8:00","10:00","12:00","14:00"],correct:2,hints:["Szukaj najwyżej położonego punktu wykresu.","Odczytaj wartości: 18, 22, 27, 25, 21 °C.","Najwyższa temperatura (27 °C) była o 12:00."]},{kind:"choice",title:"Terminal – wykres funkcji",topic:"funkcje",prompt:"Terminal pyta: „Który wzór opisuje funkcję z wykresu?”",visual:{type:"line",title:"Wykres funkcji",xLabel:"x",yLabel:"y",points:[[0,2],[3,-4]],connect:!0,extend:!0,xRange:[-2,5],yRange:[-6,6],grid:!0},options:["y = 2x + 2","y = −2x + 2","y = −0,5x + 2","y = −2x − 2"],correct:1,hints:["Odczytaj punkt przecięcia z osią OY i sprawdź, czy funkcja rośnie, czy maleje.","b = 2. a = (−4 − 2)/(3 − 0).","a = −2, b = 2 → y = −2x + 2."]},{kind:"choice",title:"Terminal – koszt produkcji",topic:"funkcje",prompt:"Terminal pyta: „Wykres przedstawia koszt K wyprodukowania n sztuk. Jaki jest koszt stały i koszt jednej sztuki?”",visual:{type:"line",title:"Koszt produkcji K(n) [zł]",xLabel:"n (szt.)",yLabel:"zł",points:[[0,500],[10,700],[20,900]],connect:!0,xRange:[0,25],yRange:[0,1100],grid:!0},options:["200 zł i 50 zł/szt.","500 zł i 20 zł/szt.","500 zł i 70 zł/szt.","700 zł i 20 zł/szt."],correct:1,hints:["Koszt stały ponosimy nawet przy n = 0.","K(0) = 500. Ile rośnie koszt przy 10 dodatkowych sztukach?","(700 − 500) / 10 = 20 zł/szt. Odpowiedź: 500 zł i 20 zł/szt."]})},kubek:{bonus:!0,variants:G({kind:"number",title:"Kubek informatyka",topic:"jednostki",unit:"kubków",prompt:"Na kubku: „Mieszczę 250 ml”. Ile takich kubków napełnisz z 2 l kawy?",answer:8,hints:["Zamień litry na mililitry.","2 l = 2000 ml.","2000 : 250 = 8 kubków."]},{kind:"number",title:"Kubek informatyka",topic:"potegi",prompt:"Na kubku: „3^(x+1) = 81”. Oblicz x.",answer:3,hints:["Zapisz 81 jako potęgę trójki.","81 = 3⁴, więc x + 1 = 4.","x = 3."]},{kind:"number",title:"Kubek informatyka",topic:"jednostki",unit:"m/s",prompt:"Na kubku: „Mój wózek jeździ 72 km/h”. Ile to m/s?",answer:20,hints:["1 km = 1000 m, 1 h = 3600 s.","Prędkość w km/h dzielimy przez 3,6.","72 : 3,6 = 20 m/s."]})},drzwi_magazyn:{variants:G({kind:"code",style:"letters",title:"Drzwi magazynu",topic:"statystyka",answer:["D","4","2"],wheels:[zi,zt,zt],prompt:"Zamek: LITERA i liczba dwucyfrowa. Litera – z monitora z tabelą, liczba – z wydruku.",hints:["Potrzebujesz monitora z tabelą i wydruku z drukarki (najpierw uruchom terminal).","Średnia = suma : 5. Obwód prostokąta = 2(a + b).","Średnia: 75 : 5 = 15 → próbka D. Obwód: 2 · 21 = 42. Hasło: D42."]},{kind:"code",style:"letters",title:"Drzwi magazynu",topic:"funkcje",answer:["C","4","2"],wheels:[zi,zt,zt],prompt:"Zamek: LITERA i liczba dwucyfrowa. Litera – z monitora z tabelą, liczba – z wydruku.",hints:["Potrzebujesz monitora z tabelą i wydruku z drukarki (najpierw uruchom terminal).","Wierzchołek paraboli: p = −b/(2a). Suma ciągu arytmetycznego: Sₙ = (a₁ + aₙ)/2 · n.","p = 3 → próbka C (f(3) = 1). S₆ = (2 + 12)/2 · 6 = 42. Hasło: C42."]},{kind:"code",style:"letters",title:"Drzwi magazynu",topic:"technika",answer:["D","4","2"],wheels:[zi,zt,zt],prompt:"Zamek: LITERA i liczba dwucyfrowa. Litera – z monitora z tabelą, liczba – z wydruku.",hints:["Potrzebujesz monitora z tabelą i wydruku z drukarki (najpierw uruchom terminal).","Wydajność = liczba sztuk : czas. 35% = 0,35.","A 60, B 70, C 60, D 75, E 60 szt./h → D. 0,35 · 120 = 42. Hasło: D42."]})},pudla:{variants:G({kind:"order",title:"Regał z pudłami",topic:"bryly",orderLabel:["najmniejsza objętość","największa objętość"],prompt:"Ustaw pudła (prostopadłościany, wymiary w dm) od NAJMNIEJSZEJ do NAJWIĘKSZEJ objętości.",items:["D: 4 × 4 × 1","B: 5 × 2 × 2","A: 2 × 3 × 4","E: 1 × 5 × 5","C: 3 × 3 × 3"],hints:["Policz objętość każdego pudła.","V = a · b · c.","D = 16, B = 20, A = 24, E = 25, C = 27 dm³."]},{kind:"order",title:"Regał z pojemnikami",topic:"bryly",orderLabel:["najmniejsza objętość","największa objętość"],prompt:"Ustaw pojemniki od NAJMNIEJSZEJ do NAJWIĘKSZEJ objętości (wymiary w dm).",items:["ostrosłup: podstawa 9 × 9, H = 4","kula: r = 3","sześcian: a = 5","walec: r = 3, h = 5","stożek: r = 6, h = 4"],hints:["Policz objętości, przyjmując π ≈ 3,14.","Ostrosłup 1/3·Pp·H, kula 4/3πr³, walec πr²h, stożek 1/3πr²h.","108 < 36π ≈ 113 < 125 < 45π ≈ 141 < 48π ≈ 151."]},{kind:"order",title:"Regał z dostawami",topic:"optymalizacja",orderLabel:["najtańsza za kg","najdroższa za kg"],prompt:"Ustaw dostawy od NAJNIŻSZEJ do NAJWYŻSZEJ ceny za 1 kg.",items:["B: 5 kg za 20 zł","E: 20 kg za 85 zł","A: 12 kg za 54 zł","D: 8 kg za 38 zł","C: 25 kg za 125 zł"],hints:["Porównuj cenę jednostkową, a nie cenę całej dostawy.","Cena za kg = cena : masa.","B 4,00; E 4,25; A 4,50; D 4,75; C 5,00 zł/kg."]})},waga:{bonus:!0,variants:G({kind:"number",title:"Waga magazynowa",topic:"jednostki",unit:"g",prompt:"Waga pokazuje 2 kg 350 g. Ile to gramów?",answer:2350,hints:["1 kg = 1000 g.","2 kg = 2000 g.","2000 + 350 = 2350 g."]},{kind:"number",title:"Waga magazynowa",topic:"potegi",unit:"g",prompt:"Masa izotopu maleje według wzoru m(t) = 80 · (1/2)^(t/5), t w latach. Ile gramów zostanie po 15 latach?",answer:10,hints:["Podstaw t = 15.","(1/2)^(15/5) = (1/2)³ = 1/8.","80 · 1/8 = 10 g."]},{kind:"number",title:"Waga magazynowa",topic:"technika",unit:"szt.",prompt:"Paleta z kartonami waży 800 kg. Pusta paleta waży 25 kg, a jeden karton 25 kg. Ile kartonów jest na palecie?",answer:31,hints:["Odejmij masę samej palety.","800 − 25 = 775 kg kartonów.","775 : 25 = 31 kartonów
