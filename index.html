ro:"You stayed after lessons to finish a project. Suddenly the classroom door slams, the lock turns by itself and the lights flicker and die. By the light of your phone you see fresh chalk on the blackboard: “Whoever wants to leave must count like we did. — The Class of 1926”. Look around – the old school hides more than it seems.",ending:"The last dial clicks into place and the heavy main door creaks open. On the doorstep lies a yellowed envelope: “Congratulations! You have proved that maths opens every door. Our notebook leads further – to the pyramids… — The Class of 1926”. You step out into the cool evening air with the notebook under your arm.",reward:"Old School Graduate",items:{klucz_mosiezny:{name:"Brass key",description:"An old key engraved with the words “Staff room”."},karta_biblio:{name:"Library card",description:"A card numbered 1926. It opens the electronic lock of the library."},klucz_piwnica:{name:"Iron key",description:"A heavy key with a tag: “Basement / Archive”."},zeszyt:{name:"Notebook of the Class of 1926",description:"A notebook full of notes by former pupils. Someone left it for you."}},clues:{notatka_plecak:{title:"Note from the backpack",text:"“The desk drawer opens with a three-digit code. Order: BLACKBOARD – CLOCK – POSTER.”"},tablica_wynik:{title:"Blackboard result",text:"The answer to the blackboard task is 7. It is the first digit of the drawer code."},zegar:{title:"Stopped clock",text:G("The clock has stopped. Carved beneath it: “The second digit is the hour shown on the clock”.","The clock has stopped. Carved beneath it: “Second digit = (angle between the hands) ÷ 30°”.","The clock has stopped. Carved beneath it: “Second digit = (angle between the hands) ÷ 30°”.")},plakat:{title:"Poster with the school plan",text:G("Pencilled in the corner of the plan: “Third digit = the perimeter of a square with side 2 cm (in cm)”.","Pencilled in the corner of the plan: “Third digit = log₂ 256”.","Pencilled in the corner of the plan: “Third digit = 2.4 m expressed in decimetres, divided by 3”."),visual:G({type:"shapes",shapes:[{kind:"square",label:"Square",dims:["a = 2 cm"]}]},void 0,void 0)},wykres:{title:"Chart from the corkboard",text:G("Chart: the number of books borrowed from the school library in successive years.","Chart: the number of pupils at the school. The points lie on one straight line – the number grew linearly.","Table and chart: the school’s yearly electricity costs (£)."),visual:G({type:"bars",title:"Books borrowed",labels:["1984","1985","1986","1987","1988"],values:[120,180,150,240,200],unit:"books"},{type:"line",title:"Number of pupils",xLabel:"year",yLabel:"pupils",points:[[1980,200],[1985,250],[1990,300]],connect:!0,xRange:[1978,2e3],yRange:[0,400],grid:!0},{type:"bars",title:"Electricity cost (£)",labels:["2018","2019","2020","2021","2022"],values:[400,440,550,605,660],unit:"£"})},edziennik:{title:"Message in the e-register",text:G("“Staff locker code = the year in which EXACTLY TWICE as many books were borrowed as in 1984.”","“Staff locker code = the year in which, following the trend in the chart, the school will have 350 pupils.”","“Staff locker code = the year in which the PERCENTAGE increase in electricity costs over the previous year was the largest.”")},kalendarz:{title:"Circled day on the calendar",text:G("A day on the calendar is circled and described by the calculation: 4² + 20 ÷ 4.","A day on the calendar is circled and described by the expression: 5 · log₃ 81 + 1.","A day on the calendar is circled and described as: 15% of 140.")},wiadomosc_regal:{title:"Message behind the books",text:"“You will open the trunk with this code: the LETTER of the shape with the LARGEST area in the library painting, followed by the NUMBER circled on the staff-room calendar.”"},obraz:{title:"Painting with shapes",text:G("The painting shows four shapes labelled A–D.","The painting shows four shapes labelled A–D.","The painting shows four metal sheets (A–D) from the school workshop."),visual:G({type:"shapes",shapes:[{kind:"rect",label:"A",dims:["6 cm × 4 cm"]},{kind:"square",label:"B",dims:["side 5 cm"]},{kind:"triangle",label:"C",dims:["base 10 cm","height 6 cm"]},{kind:"trapezoid",label:"D",dims:["parallel sides 4 cm and 6 cm","height 5 cm"]}]},{type:"shapes",shapes:[{kind:"circle",label:"A",dims:["radius 3"]},{kind:"triangle",label:"B",dims:["equilateral triangle","side 8"]},{kind:"rect",label:"C",dims:["5 × 5.5"]},{kind:"rhombus",label:"D",dims:["diagonals 7 and 8"]}]},{type:"shapes",shapes:[{kind:"rect",label:"A",dims:["1.2 m × 0.8 m"]},{kind:"circle",label:"B",dims:["diameter 1.1 m"]},{kind:"triangle",label:"C",dims:["base 1.5 m","height 1.2 m"]},{kind:"trapezoid",label:"D",dims:["parallel sides 1.0 m and 0.9 m","height 1.0 m"]}]})},teczka:{title:"Folder “Class of 1926”",text:G("In the folder: “Each symbol is a digit. ★ + ★ = 10,  ★ + ● = 8,  ● · ▲ = 21,  ▲ − ■ = 5”.","In the folder: “★ and ● satisfy the system: ★ + ● = 9, ★ − ● = 1.  ▲ is the solution of ▲² − 6▲ + 9 = 0.  ■ satisfies 2^■ = 64”.","In the folder, a cost estimate for repairing the door: ★ = the number of 1-litre tins of paint for a 40 m² wall (1 l of paint covers 8 m²); ● = how many hours the job takes 3 people if it needs 12 person-hours; ▲ = the discount in % (price £300, after discount £291); ■ = 6000 cm³ expressed in litres.")},symbole:{title:"Symbols on the wall",text:"Above the exit door the symbols are painted in order: ▲ ★ ■ ●. Next to them: “Set the exit dials like this”.",visual:{type:"symbols",items:["▲","★","■","●"],caption:"order of the dials"}},kronika:{title:"School chronicle",text:"“1926. Our maths class hid puzzles in the school for future generations. Whoever solves them will find the way out – and our notebook.”"}},puzzles:{tablica:{sp:{title:"Sum on the blackboard",prompt:"Someone wrote in chalk: (18 − 3 · 4) + 12 ÷ 4 − 2 = ?  Work out the value of the expression.",hints:["Don’t work from left to right! Remember the order of operations.","First the bracket (with the multiplication inside), then the division, and finally addition and subtraction.","3 · 4 = 12; 18 − 12 = 6; 12 ÷ 4 = 3; 6 + 3 − 2 = 7. Answer: 7."]},lo:{title:"Equation on the blackboard",prompt:"Someone wrote an equation on the blackboard: 2(x − 3) + 5 = x + 6. Find x.",hints:["Start by expanding the bracket.","2(x − 3) = 2x − 6. Move the x terms to the left and the numbers to the right.","2x − 6 + 5 = x + 6 → 2x − 1 = x + 6 → x = 7."]},tech:{title:"Discount on the blackboard",unit:"£",prompt:"The blackboard says: “After a 30% discount a notebook costs £4.90”. What did it cost before the discount (in £)?",hints:["After a 30% discount you pay only part of the original price – which part?","The discounted price is 70% of the original: 0.7 · x = 4.90.","x = 4.90 ÷ 0.7 = £7."]}},szuflada:{sp:{title:"Desk drawer",prompt:"The drawer has a lock with three dials (0–9). Combine the clues from the blackboard, the clock and the poster.",hints:["The note from the backpack tells you where each digit comes from and in what order.","Digit 1: the blackboard result. Digit 2: the hour on the clock. Digit 3: the perimeter of the square = 4 · a.","Blackboard: 7, clock: 4 (4 o’clock), poster: 4 · 2 = 8. Code: 748."]},lo:{title:"Desk drawer",prompt:"The drawer has a lock with three dials (0–9). Combine the clues from the blackboard, the clock and the poster.",hints:["The note from the backpack tells you where each digit comes from and in what order.","A clock face is 360°, so each hour is 30°. log₂ 256 = c ⇔ 2ᶜ = 256.","Blackboard: x = 7. Clock 4:00 → 120°, 120 ÷ 30 = 4. 2⁸ = 256, so log₂ 256 = 8. Code: 748."]},tech:{title:"Desk drawer",prompt:"The drawer has a lock with three dials (0–9). Combine the clues from the blackboard, the clock and the poster.",hints:["The note from the backpack tells you where each digit comes from and in what order.","One hour on the clock face is 30°. 1 m = 10 dm.","Blackboard: £7. Clock 4:00 → 120° ÷ 30° = 4. 2.4 m = 24 dm, 24 ÷ 3 = 8. Code: 748."]}},kosz:{sp:{title:"Crumpled paper",prompt:"On the paper from the bin: 3, 6, 12, __, 48. Which number has been smudged out?",hints:["Compare each number with the one before it.","Each number is twice the previous one.","12 · 2 = 24 (check: 24 · 2 = 48)."]},lo:{title:"Crumpled paper",prompt:"On the paper from the bin: an arithmetic sequence with a₁ = 3 and d = 4. Find a₁₀.",hints:["Use the formula for the n-th term of an arithmetic sequence.","aₙ = a₁ + (n − 1) · d.","a₁₀ = 3 + 9 · 4 = 39."]},tech:{title:"Crumpled paper",unit:"€",prompt:"On the paper from the bin: exchange rate 1 € = 4.30 PLN. How many euros do you get for 215 PLN?",hints:["How many times does 4.30 PLN fit into 215 PLN?","Number of euros = amount in PLN ÷ exchange rate.","215 ÷ 4.30 = 50 €."]}},komputer:{sp:{title:"Computer password",prompt:"The login screen says: “The password is the LARGEST fraction”. Choose it.",options:["5/8","3/4","7/10","2/3"],hints:["Fractions with different denominators are hard to compare by eye.","Convert the fractions to decimals (divide the numerator by the denominator).","5/8 = 0.625; 3/4 = 0.75; 7/10 = 0.7; 2/3 ≈ 0.667. The largest is 3/4."]},lo:{title:"Computer password",prompt:"The login screen says: “The password is the function that is INCREASING on its whole domain”. Choose it.",options:["f(x) = −2x + 1","g(x) = (1/2)ˣ","h(x) = log₂ x","k(x) = −x²"],hints:["Increasing function: a larger input gives a larger output.","A linear function increases for a > 0, an exponential one for base > 1, a logarithmic one for base > 1.","f decreases (a = −2), g decreases (base 1/2), k is not monotonic, h(x) = log₂ x increases (base 2 > 1)."]},tech:{title:"Computer password",prompt:"The login screen says: “The password is the MOST PROFITABLE one-year savings account (ignoring tax)”. Choose it.",options:["A: 6.0% per year, compounded yearly","B: 5.8% per year, compounded monthly","C: 5.9% per year, compounded quarterly","D: 5.5% per year, compounded daily"],hints:["More frequent compounding increases the return – comparing the percentages alone is not enough.","The yearly return with compounding n times a year: (1 + r/n)ⁿ − 1.","A: 6.00%; B: (1 + 0.058/12)¹² ≈ 1.0596 → 5.96%; C: (1 + 0.059/4)⁴ ≈ 1.0603 → 6.03%; D < 5.7%. Best: C."]}},szafka:{sp:{title:"Staff locker",prompt:"The locker has a 4-digit keypad. The question is in the e-register; the data is on the chart.",hints:["First log in to the computer – the question is there. The data is on the corkboard.","Check how many books were borrowed in 1984 and multiply by 2.","1984: 120 books; 2 · 120 = 240 → the year 1987. Code: 1987."]},lo:{title:"Staff locker",prompt:"The locker has a 4-digit keypad. The question is in the e-register; the data is on the chart.",hints:["First log in to the computer – the question is there. The data is on the corkboard.","Find the rate of growth: by how many pupils a year does the number rise? Then extend the line.","Between 1980 and 1990 the school gained 100 pupils → 10 a year. 350 − 200 = 150 → 15 years after 1980 → 1995."]},tech:{title:"Staff locker",prompt:"The locker has a 4-digit keypad. The question is in the e-register; the data is on the chart.",hints:["First log in to the computer – the question is there. The data is on the corkboard.","Percentage increase = (new − old) / old · 100%. Work it out for each year.","2019: +10%, 2020: +25%, 2021: +10%, 2022: ≈ +9.1%. The largest was in 2020. Code: 2020."]}},doniczka:{sp:{title:"Note in the flowerpot",unit:"min",prompt:"The note says: “Break lasts 3/4 of an hour”. How many minutes is that?",hints:["An hour has 60 minutes.","Find 3/4 of 60: first 60 ÷ 4, then multiply by 3.","60 ÷ 4 = 15; 15 · 3 = 45 minutes."]},lo:{title:"Note in the flowerpot",prompt:"The note says: “3x − 7 > 11”. Give the smallest integer that satisfies the inequality.",hints:["Solve the inequality like an equation, watching the sign.","3x > 18, so x > 6.","x > 6 – the smallest integer is 7."]},tech:{title:"Note in the flowerpot",unit:"£",prompt:"The note says: “The caretaker earns £32 gross per hour”. How much does he earn for 7.5 hours of work?",hints:["Pay = hourly rate · time.","32 · 7.5 = 32 · 7 + 32 · 0.5.","224 + 16 = £240."]}},regal:{sp:{title:"Books on the shelf",orderLabel:["smallest","largest"],prompt:"There are numbers on the spines of five books. Arrange the books from the SMALLEST to the LARGEST value.",items:["1/3","2/5","0.5","0.6","3/4"],hints:["Numbers are easier to compare when written in the same form.","Convert the fractions to decimals: 1/3 ≈ 0.33; 2/5 = 0.4; 3/4 = 0.75.","Order: 1/3 (0.33) → 2/5 (0.4) → 0.5 → 0.6 → 3/4 (0.75)."]},lo:{title:"Books on the shelf",orderLabel:["smallest","largest"],prompt:"There are numbers on the spines of five books. Arrange the books from the SMALLEST to the LARGEST value.",items:["2^1.5","log₂ 8","π","√10","10/3"],hints:["Estimate each number to two decimal places.","2^1.5 = 2√2 ≈ 2.83; log₂ 8 = 3; π ≈ 3.14; √10 ≈ 3.16; 10/3 ≈ 3.33.","Order: 2^1.5 → log₂ 8 → π → √10 → 10/3."]},tech:{title:"Books on the shelf",orderLabel:["shortest","longest"],prompt:"There are lengths on the spines of the books. Arrange them from the SHORTEST to the LONGEST.",items:["95 cm","10.5 dm","0.0011 km","1150 mm","1.2 m"],hints:["Express all lengths in the same unit.","Convert to millimetres: 1 cm = 10 mm, 1 dm = 100 mm, 1 m = 1000 mm, 1 km = 1 000 000 mm.","950 mm < 1050 mm < 1100 mm < 1150 mm < 1200 mm → 95 cm, 10.5 dm, 0.0011 km, 1150 mm, 1.2 m."]}},kufer:{sp:{title:"Trunk with a combination lock",prompt:"The trunk has a lock with three wheels: a letter, a digit, a digit.",hints:["The message behind the books tells you what you need: the painting and the calendar.","Areas: rectangle a·b, square a², triangle a·h/2, trapezium (a+b)·h/2. Calendar: powers and division first.","A = 24, B = 25, C = 30, D = 25 → C. Calendar: 16 + 5 = 21. Code: C21."]},lo:{title:"Trunk with a combination lock",prompt:"The trunk has a lock with three wheels: a letter, a digit, a digit.",hints:["The message behind the books tells you what you need: the painting and the calendar.","Circle πr², equilateral triangle a²√3/4, rhombus d₁·d₂/2. log₃ 81 = 4 because 3⁴ = 81.","A ≈ 28.27; B ≈ 27.71; C = 27.5; D = 28 → A. Calendar: 5 · 4 + 1 = 21. Code: A21."]},tech:{title:"Trunk with a combination lock",prompt:"The trunk has a lock with three wheels: a letter, a digit, a digit.",hints:["The message behind the books tells you what you need: the painting and the calendar.","Circle: π·(d/2)². Trapezium: (a+b)·h/2. 15% = 0.15.","A = 0.96 m²; B ≈ 0.950 m²; C = 0.90 m²; D = 0.95 m² → A. Calendar: 0.15 · 140 = 21. Code: A21."]}},globus:{sp:{title:"Hiding place in the globe",unit:"m",prompt:"The note in the globe says: “From the library to the market square is 2.5 km”. How many metres is that?",hints:["A kilometre is a thousand metres.","2.5 km = 2.5 · 1000 m.","2500 m."]},lo:{title:"Hiding place in the globe",prompt:"The note says: “We roll two dice. What is the probability that the total is 7?” Give a fraction (e.g. 1/6).",hints:["Count all possible results of rolling two dice.","|Ω| = 36. List the pairs that add up to 7.","(1,6), (2,5), (3,4), (4,3), (5,2), (6,1) → 6/36 = 1/6."]},tech:{title:"Hiding place in the globe",prompt:"The note lists the librarian’s commute on successive days (min): 12, 15, 18, 15, 20. Calculate the mean.",hints:["Mean = sum of the values ÷ number of values.","Sum: 12 + 15 + 18 + 15 + 20.","80 ÷ 5 = 16 minutes."]}},bezpieczniki:{sp:{title:"Fuse box",prompt:"A sign on the box says: “To switch on the light, turn on fuses totalling EXACTLY 33 A”.",hints:["Start with the largest fuse and see how much is missing to reach 33.","33 − 20 = 13. Which two fuses add up to 13?","20 + 8 + 5 = 33 A."]},lo:{title:"Fuse box",prompt:"A sign on the box says: “Turn on the fuses whose values add up to EXACTLY 29”.",hints:["First work out the value of each label.","log₂ 32 = 5, √64 = 8, 3! = 6, 2⁴ = 16, sin 30° = 1/2.","E.g. 16 + 8 + 5 = 29 (or 5 + 8 + 6 + 10 = 29)."]},tech:{title:"Fuse box",prompt:"A sign on the box says: “Turn on circuits with a total power of EXACTLY 2.4 kW”.",switchLabels:["230 V · 2 A","0.75 kW","1.2 kW","230 V · 5 A","0.5 kW"],hints:["Express all powers in the same unit (W).","P = U · I; 1 kW = 1000 W. Powers: 460, 750, 1200, 1150, 500 W.","1150 + 750 + 500 = 2400 W = 2.4 kW."]}},zdjecie:{sp:{title:"Photo of the Class of 1926",prompt:"The caption reads: “There were 28 pupils in the class and 3/7 of them were girls”. How many boys were there?",hints:["First count the girls.","3/7 of 28 = 28 ÷ 7 · 3.","Girls: 12, boys: 28 − 12 = 16."]},lo:{title:"Photo of the Class of 1926",prompt:"The caption reads: “From 6 candidates we chose a president and a vice-president”. In how many ways could this be done?",hints:["Order matters – these are two different roles.","President: 6 options, vice-president: the remaining 5.","6 · 5 = 30 ways."]},tech:{title:"Photo of the Class of 1926",unit:"cm²",prompt:"A 10 cm × 15 cm photo was enlarged at a scale of 3 : 1. What is the area (cm²) of the print?",hints:["Scale 3 : 1 – every dimension is 3 times bigger.","New dimensions: 30 cm × 45 cm.","30 · 45 = 1350 cm² (the area grows 9 times)."]}},wyjscie:{sp:{title:"Main exit lock",prompt:"The main door has four dials marked with the symbols from the wall, in order.",hints:["You need the folder from the archive cabinet (symbol values) and the wall with symbols (the order).","Work in order: find ★ from the first equation, then ●, ▲ and ■.","★ = 5, ● = 3, ▲ = 7, ■ = 2. Order ▲ ★ ■ ● → 7523."]},lo:{title:"Main exit lock",prompt:"The main door has four dials marked with the symbols from the wall, in order.",hints:["You need the folder from the archive cabinet (symbol values) and the wall with symbols (the order).","System: add the equations. ▲² − 6▲ + 9 = (▲ − 3)². 64 = 2⁶.","★ = 5, ● = 4, ▲ = 3, ■ = 6. Order ▲ ★ ■ ● → 3564."]},tech:{title:"Main exit lock",prompt:"The main door has four dials marked with the symbols from the wall, in order.",hints:["You need the folder from the archive cabinet (symbol values) and the wall with symbols (the order).","★ = 40 ÷ 8; ● = 12 ÷ 3; discount = £9 out of £300; 1 l = 1000 cm³.","★ = 5, ● = 4, ▲ = 3%, ■ = 6 l. Order ▲ ★ ■ ● → 3564."]}}},rooms:{klasa:{name:"Classroom",intro:"An old classroom. It smells of chalk and dust. The door is locked and there is a task on the blackboard.",objects:{k_tablica:{name:"Blackboard",description:"Someone has written a task on the blackboard. Below it: “The answer is the start of the way”.",openedText:"A note appears under your solution: “Well done! This number opens the first puzzle”."},k_zegar:{name:"Wall clock",description:"An old pendulum clock. It has stopped – the hands do not move. There is an inscription below it."},k_plakat:{name:"Poster with the school plan",description:"A faded plan of the school from 1926. Someone has pencilled a puzzle in the corner."},k_okno:{name:"Window",description:"It is getting dark outside. The window has bars – you will not get out this way. There is chalk on the windowsill."},k_plecak:{name:"Abandoned backpack",description:"Somebody’s old backpack. There is a folded note in the side pocket."},k_biurko:{name:"Teacher’s desk",description:"A massive desk. The drawer has a lock with three dials.",openedText:"The drawer is open and empty.",message:"The drawer clicks open! Inside lies a brass key."},k_kosz:{name:"Wastepaper bin",description:"There is a crumpled sheet of paper with a task in the bin.",openedText:"Solved! Someone from the Class of 1926 would be proud."},k_drzwi:{name:"Door to the staff room",description:"A solid wooden door. Locked.",lockedText:"You need a key. Maybe it is somewhere in the classroom?",openedText:"The door is open. Behind it is the corridor to the staff room."}}},pokoj:{name:"Staff room",intro:"The staff room. Long-forgotten tea is going cold on the table. The computer’s light is blinking and there is a locked locker in the corner.",objects:{p_korkowa:{name:"Corkboard with a chart",description:"A chart is pinned to the board. Someone has circled it with a red pen."},p_kalendarz:{name:"Calendar",description:"A wall calendar. One day is circled and there is a calculation next to it. It may be useful later…"},p_komputer:{name:"Computer",description:"A computer with the electronic register. It needs a password.",openedText:"Logged in. A message with a question is waiting in the e-register.",message:"The screen lights up – a message is waiting in the e-register!"},p_doniczka:{name:"Pot with a fern",description:"The corner of a note is sticking out from under the pot.",openedText:"Note solved."},p_szafka:{name:"Staff locker",description:"A metal locker with a four-digit lock.",openedText:"The locker stands open.",message:"The lock beeps and the locker opens. Inside – a library card!"},p_regal:{name:"Shelf of class registers",description:"Old class registers from the 1920s. In one of them someone wrote: “A calendar is not just dates – remember the circled number”."},p_powrot:{name:"Door to the classroom",description:"The way back to the classroom."},p_drzwi:{name:"Door to the library",description:"A door with an electronic card reader.",lockedText:"The reader glows red. You need a library card.",openedText:"The reader turned green. The way to the library is clear."}}},biblioteka:{name:"Library",intro:"The library is in semi-darkness. The smell of old paper hangs between the shelves. A metal-bound trunk stands in the corner.",objects:{b_regal:{name:"Bookcase with numbered books",description:"On the middle shelf stand five books with numbers on their spines. They look out of order.",openedText:"A hiding place has opened behind the books.",message:"Click! A hiding place with a message opens behind the books."},b_obraz:{name:"Painting with shapes",description:"A strange painting in a gold frame – nothing but geometric shapes."},b_kronika:{name:"School chronicle",description:"An open school chronicle lies on the lectern."},b_globus:{name:"Globe",description:"The globe has a slot along the equator. There is a note inside.",openedText:"The globe puzzle is solved."},b_kufer:{name:"Metal-bound trunk",description:"An old trunk with a combination lock: a letter and two digits.",openedText:"The trunk is open.",message:"The lid creaks open. At the bottom lies an iron key with a “Basement” tag."},b_lampa:{name:"Desk lamp",description:"A lamp with a green shade. It gives a little light – enough to read by."},b_powrot:{name:"Door to the staff room",description:"The way back to the staff room."},b_klapa:{name:"Basement hatch",description:"A wooden hatch in the floor with an iron padlock.",lockedText:"The padlock is closed. You need a key.",openedText:"The hatch is open. Steep stairs lead down to the basement archive."}}},piwnica:{name:"Basement archive",intro:"The basement is almost completely dark. By the light of your phone you can see a fuse box and a massive door – the school’s main emergency exit.",objects:{w_bezpieczniki:{name:"Fuse box",description:"An old box with five fuses.",openedText:"The fuses are on – the basement light is on.",message:"A hum… and the bulbs flash on! Now you can see the whole basement."},w_szafa:{name:"Archive cabinet",description:"A cabinet full of folders. One is labelled “Class of 1926”."},w_symbole:{name:"Symbols on the wall",description:"Only in the light can you see the symbols painted above the door."},w_zdjecie:{name:"Old class photo",description:"A framed photo: the Class of 1926. There is a puzzle on the back.",openedText:"The pupils in the photo seem to be smiling."},w_skrzynia:{name:"Wooden crate",description:"A crate full of empty jam jars. Nothing useful."},w_schody:{name:"Stairs to the library",description:"The stairs lead back up to the library."},w_wyjscie:{name:"Main exit",description:"A massive steel door with four dials. Above it: EXIT.",openedText:"The door is wide open. You can feel fresh air!"}}}}},_s="The stone passage has four rotating rings with digits.",Ps="The chest has three wheels with shape symbols. Set them according to the papyrus.",Es="The sarcophagus lid is held by three stone rings.",om={title:"The Secret of the Egyptian Pyramid",subtitle:"Chapter II – Numbers of the Pharaohs",description:"An archaeological expedition turns into a trap: the pyramid’s stone gate closes behind you. The ancient priests left puzzles – solve them to see the sun again.",intro:"The notebook of the Class of 1926 has led you to Egypt. You cross the threshold of the pyramid with the expedition… and suddenly you hear a crash. The stone gate closes behind you, cutting off the way back. In the torchlight you see signs on the wall – the pharaoh’s priests clearly expected visitors.",ending:"The altar plates sink one after another and the Sun Gate opens with a roar. The desert sun dazzles you. The expedition leader cannot believe it: “You have deciphered a mechanism nobody has understood for four thousand years!”. A new page appears in the notebook of the Class of 1926: a sketch of a laboratory…",reward:"Pyramid Guardian",items:{pochodnia:{name:"Torch",description:"A burning torch. It will light up dark corners."},skarabeusz:{name:"Golden scarab",description:"A golden scarab figurine. It fits some kind of hollow."},klucz_ra:{name:"Key of Ra",description:"A key shaped like the sun with rays."}},clues:{legenda:{title:"Key to Egyptian numerals",text:"A clay tablet explains the signs: stroke = 1, hobble (arch) = 10, coil of rope = 100, lotus flower = 1000. Egyptians wrote a number by repeating the signs and adding their values."},posag:{title:"Tablets of the Anubis statue",text:G("The statue holds two tablets with numbers. Below: “The passage code is the SUM of both numbers”.","On the tablet the priests wrote the first three terms of a geometric sequence. Below: “The passage code is the SUM of the FIRST FIVE terms of this sequence”.","The tablet is a granary record: the number of sacks of grain. “Each month 12% of the INITIAL stock is used. The passage code is the number of sacks left after 3 months”.")},papirus:{title:"Priest’s papyrus",text:G("“Set the chest symbols: FIRST – the shape with 4 equal sides and 4 right angles. SECOND – the shape whose angles add up to 180°. THIRD – the shape with no vertices.”","“Set the chest symbols: FIRST – the regular polygon with an interior angle of 120°. SECOND – the regular polygon with exactly 5 diagonals. THIRD – the regular polygon whose interior angles add up to 360°.”","“Set the chest symbols (bar cross-sections): FIRST – the cross-section with area ≈ 3.14 cm² for a dimension of 2 cm (diameter). SECOND – the regular profile with a perimeter of 15 cm and side 3 cm. THIRD – the profile with area a²√3/4.”"),visual:{type:"symbols",items:["tri","sq","pent","hex","circ"],caption:"symbols on the chest wheels"}},model_wynik:{title:"Number from the pyramid model",text:"The pyramid model hides the number 60."},inskrypcja:{title:"Inscription above the sarcophagus",text:G("“Sarcophagus code: the first two digits are the number from the pyramid model, the last one is the number of VERTICES of a square-based pyramid.”","“Sarcophagus code: the first two digits are the number from the pyramid model, the last one is the number of EDGES of a square-based pyramid.”","“Sarcophagus code: the first two digits are the number from the pyramid model, the last one is the number of all FACES of a square-based pyramid (including the base).”")},gwiazdy:{title:"Star map",text:G("Carved between the stars: “The altar plates must add up to 25% of 120”.","Carved between the stars: “The altar plates must add up to the MINIMUM value of f(x) = x² − 8x + 46”.","Carved between the stars are the heights of Nile floods (cubits): 22, 35, 30, 41, 28. “The altar plates must add up to the MEDIAN of these data”.")},klepsydra:{title:"Hourglass",text:"On the hourglass: “Time flows like sand – but the wise do not rush their counting”."}},puzzles:{przejscie:{sp:{title:"Stone passage",prompt:_s,hints:["Read both numbers from the statue’s tablets – the key to the signs is on the clay tablet.","Count the signs of each kind: lotuses (thousands), coils (hundreds), arches (tens), strokes (ones).","Tablets: 1243 and 135. Sum: 1243 + 135 = 1378."]},lo:{title:"Stone passage",prompt:_s,hints:["Read the numbers from the tablet – the key to the signs is on the clay tablet.","Sequence 3, 12, 48: ratio r = 4. Sₙ = a₁ · (rⁿ − 1)/(r − 1).","S₅ = 3 · (4⁵ − 1)/3 = 1024 − 1 = 1023 (3 + 12 + 48 + 192 + 768)."]},tech:{title:"Stone passage",prompt:_s,hints:["Read the grain stock from the tablet – the key to the signs is on the clay tablet.","The tablet shows 2 lotuses and 5 coils. 12% is always taken from the initial stock.","2500 sacks; 12% · 2500 = 300 a month; 2500 − 3 · 300 = 1600."]}},mozaika:{sp:{title:"Floor mosaic",prompt:"The mosaic has 7 rows of 9 tiles, but 15 tiles have fallen out. How many tiles are left?",hints:["First count all the tiles.","7 · 9 = 63.","63 − 15 = 48."]},lo:{title:"Floor mosaic",prompt:"The mosaic is a regular octagon. How many diagonals does an octagon have?",hints:["From each vertex, diagonals go to the non-adjacent vertices.","Number of diagonals of an n-gon: n(n − 3)/2.","8 · 5 / 2 = 20."]},tech:{title:"Floor mosaic",unit:"tiles",prompt:"A tile measures 20 cm × 20 cm. How many tiles are needed for a 3 m × 2.4 m floor (no spare)?",hints:["Compare the floor area with the area of one tile – in the same units.","3 m × 2.4 m = 300 cm × 240 cm; one tile: 400 cm².","72 000 ÷ 400 = 180 tiles."]}},sciana:{sp:{title:"Wall of hieroglyphs",prompt:"A sequence is carved on the wall: 2, 5, 11, 23, 47, … What is the next number?",hints:["Check how each number is made from the previous one.","Try: multiply by 2 and add something.","Rule: ×2 + 1. 47 · 2 + 1 = 95."]},lo:{title:"Wall of hieroglyphs",prompt:"The wall describes an arithmetic sequence: a₃ = 11, a₇ = 27. Find a₁₂.",hints:["There are 4 “steps” of the sequence between a₃ and a₇.","4d = 27 − 11, so d = 4. Then a₁ = a₃ − 2d.","d = 4, a₁ = 3, a₁₂ = 3 + 11 · 4 = 47."]},tech:{title:"Wall of hieroglyphs",unit:"bricks",prompt:"The builders made 4000 bricks in week 1, and each week 5% more than the week before. How many bricks were made in week 3?",hints:["This is a geometric sequence – each week is the previous one · 1.05.","a₃ = a₁ · r², r = 1.05.","4000 · 1.05² = 4000 · 1.1025 = 4410."]}},waga:{sp:{title:"Priests’ balance",unit:"g",prompt:"On the balance, 3 jugs of oil balance 2 sacks of grain. A sack weighs 150 g (it is a model!). How much does one jug weigh?",hints:["Work out how much both sacks weigh together.","2 · 150 = 300 g – that is what 3 jugs weigh.","300 ÷ 3 = 100 g."]},lo:{title:"Priests’ balance",prompt:"The mass m of a stone satisfies the proportion m : 12 = 15 : 4. Find m.",hints:["In a proportion, the product of the outer terms equals the product of the inner terms.","4m = 12 · 15.","m = 180 ÷ 4 = 45."]},tech:{title:"Priests’ balance",unit:"kg",prompt:"Bronze is an alloy of copper and tin in the ratio 4 : 1. How many kg of copper are there in 35 kg of bronze?",hints:["The alloy consists of 4 + 1 = 5 equal parts.","One part = 35 ÷ 5 kg.","7 kg · 4 = 28 kg of copper."]}},skrzynia:{sp:{title:"Chest with symbols",prompt:Ps,hints:["The clue is on the papyrus hidden behind the wall of hieroglyphs.","A triangle’s angles add up to 180°; a square has 4 equal sides and right angles.","Square, triangle, circle."]},lo:{title:"Chest with symbols",prompt:Ps,hints:["The clue is on the papyrus hidden behind the wall of hieroglyphs.","Interior angle of a regular n-gon: (n − 2)·180°/n. Diagonals: n(n − 3)/2. Angle sum: (n − 2)·180°.","120° → hexagon; 5 diagonals → pentagon; 360° → square."]},tech:{title:"Chest with symbols",prompt:Ps,hints:["The clue is on the papyrus hidden behind the wall of hieroglyphs.","A circle with diameter 2 cm: π · 1² ≈ 3.14. 15 ÷ 3 = 5 sides. a²√3/4 is the area of an equilateral triangle.","Circle, pentagon, triangle."]}},model:{sp:{title:"Pyramid model",unit:"dm³",prompt:"The model stands on a cuboid plinth measuring 5 dm × 4 dm × 3 dm. Work out the volume of the plinth (dm³).",hints:["The volume of a cuboid depends on its three dimensions.","V = a · b · c.","5 · 4 · 3 = 60 dm³."]},lo:{title:"Pyramid model",prompt:"The model is a regular square-based pyramid: base edge 6, height 4. Work out the lateral surface area.",hints:["You need the slant height of a side face (h).","h² = H² + (a/2)² = 4² + 3². A side face is a triangle with area a · h / 2.","h = 5; one face: 6 · 5 / 2 = 15; four faces: 60."]},tech:{title:"Pyramid model",unit:"m³",prompt:"The scale model represents a pyramid with a 6 m × 6 m square base and a height of 5 m. How many m³ of stone are needed to build it?",hints:["A pyramid holds less than a cuboid with the same base and height.","V = 1/3 · base area · H.","1/3 · 36 · 5 = 60 m³."]}},figury:{sp:{title:"Wall of shapes",prompt:"Match each shape to its area.",pairs:[["square with side 4","16"],["rectangle 3 × 5","15"],["triangle: base 6, height 4","12"],["parallelogram: side 7, height 2","14"]],hints:["Each shape has a different area formula.","Square a², rectangle a·b, triangle a·h/2, parallelogram a·h.","16, 15, 12, 14."]},lo:{title:"Wall of shapes",prompt:"Match each solid to its volume formula.",pairs:[["sphere","4/3 · πr³"],["cone","1/3 · πr²h"],["cylinder","πr²h"],["pyramid","1/3 · base · H"]],hints:["The cone and the pyramid are the “pointed” solids – their volume has a factor of 1/3.","A cylinder is a prism with a circular base; a cone is a “pyramid” with a circular base.","Sphere – 4/3πr³, cone – 1/3πr²h, cylinder – πr²h, pyramid – 1/3·base·H."]},tech:{title:"Wall of shapes",prompt:"Match the units to their equivalents.",pairs:[["1 m³","1000 l"],["1 ha","10 000 m²"],["1 l","1 dm³"],["1 m/s","3.6 km/h"]],hints:["Picture the size of each thing (a cube with side 1 m, a 100 m × 100 m square…).","1 m³ = 1000 dm³; 1 ha = 100 m · 100 m; 1 h = 3600 s.","1 m³ = 1000 l, 1 ha = 10 000 m², 1 l = 1 dm³, 1 m/s = 3.6 km/h."]}},plyty:{sp:{title:"Floor slabs",unit:"slabs",prompt:"The slabs measure 30 cm × 30 cm. How many slabs cover a 3 m × 1.8 m floor?",hints:["Count how many slabs fit along each side.","300 ÷ 30 = 10 slabs and 180 ÷ 30 = 6 slabs.","10 · 6 = 60 slabs."]},lo:{title:"Floor slabs",unit:"°",prompt:"The slabs are regular hexagons. How many degrees is the interior angle of one slab?",hints:["The angle sum of an n-gon: (n − 2) · 180°.","Hexagon: 4 · 180° = 720°, and the angles are equal.","720° ÷ 6 = 120°."]},tech:{title:"Floor slabs",unit:"£",prompt:"Renovating 15 m² of floor: tiles at £80/m², and we buy 10% extra. How much do the tiles cost?",hints:["The extra increases the area you need to buy.","15 m² · 1.1 = 16.5 m².","16.5 · 80 = £1320."]}},sarkofag:{sp:{title:"Sarcophagus",prompt:Es,hints:["Read the inscription above the sarcophagus and solve the pyramid-model puzzle.","A square-based pyramid: 4 base vertices + the apex.","60 and 5 vertices → 605."]},lo:{title:"Sarcophagus",prompt:Es,hints:["Read the inscription above the sarcophagus and solve the pyramid-model puzzle.","A square-based pyramid: 4 base edges + 4 slanted edges.","60 and 8 edges → 608."]},tech:{title:"Sarcophagus",prompt:Es,hints:["Read the inscription above the sarcophagus and solve the pyramid-model puzzle.","A square-based pyramid: 1 base + 4 side faces.","60 and 5 faces → 605."]}},oltarz:{sp:{title:"Altar with plates",prompt:"There are six numbered plates on the altar. Press the plates whose sum equals the number from the star map.",hints:["First solve the star-map puzzle.","25% is one quarter. 120 ÷ 4 = ?","The number is 30, e.g. 5 + 10 + 15 = 30 or 8 + 5 + 17 = 30."]},lo:{title:"Altar with plates",prompt:"There are six plates with expressions on the altar. Press the plates whose values add up to the number from the star map.",switchLabels:["2³","√49","log₅ 125","|−12|","(5 choose 2)","3!"],hints:["First find the minimum value of the quadratic function from the star map.","For a > 0 the minimum is at the vertex: p = −b/(2a) = 4, q = f(4).","f(4) = 16 − 32 + 46 = 30. E.g. 8 + 12 + 10 = 30."]},tech:{title:"Altar with plates",prompt:"There are six plates with calculations on the altar. Press the plates whose values add up to the number from the star map.",switchLabels:["15% of 60","0.25 · 48","3.6 km/h in m/s","1/4 of 32","2.5 m in dm","120 min in h"],hints:["First find the median of the star-map data – sort it!","22, 28, 30, 35, 41 – the median is the middle value. Plate values: 9, 12, 1, 8, 25, 2.","Median = 30. E.g. 9 + 12 + 8 + 1 = 30."]}},skarb:{sp:{title:"Pharaoh’s treasure",prompt:"Five caskets hold 12, 15, 9, 20 and 14 gold coins. How many coins are there per casket on average?",hints:["The mean is the sum divided by the number of caskets.","12 + 15 + 9 + 20 + 14 = 70.","70 ÷ 5 = 14 coins."]},lo:{title:"Pharaoh’s treasure",prompt:"A casket holds 5 gold and 3 silver coins. We draw 2 coins at once. Find the probability that both are gold (as a fraction).",hints:["Count all possible pairs of coins and the pairs of gold coins.","|Ω| = (8 choose 2) = 28; |A| = (5 choose 2) = 10.","P = 10/28 = 5/14."]},tech:{title:"Pharaoh’s treasure",prompt:"One troy ounce of gold is 31.1 g. How many grams are 20 ounces?",hints:["Multiply the mass of one ounce by the number of ounces.","31.1 · 20.","622 g."]}}},rooms:{wejscie:{name:"Entrance chamber",intro:"The entrance chamber. Behind you – the closed gate. In front of you – a statue of Anubis and a stone passage with rotating rings.",objects:{e_brama:{name:"Stone gate",description:"The gate you came through. Shut tight – you need to find another way out."},e_posag:{name:"Statue of Anubis",description:"The statue of the god Anubis holds tablets with strange signs."},e_pochodnia:{name:"Torch",description:"A torch in a holder. It is still burning.",openedText:"An empty torch holder.",message:"You take the torch from its holder. It will be useful in the dark."},e_tabliczka:{name:"Clay tablet",description:"A tablet with drawings of signs and numbers – like a dictionary!"},e_urna:{name:"Urn",description:"A clay urn painted with a boat on the Nile. Empty."},e_mozaika:{name:"Floor mosaic",description:"A mosaic is hidden under the sand. Some of its tiles are missing.",openedText:"Mosaic deciphered."},e_przejscie:{name:"Stone passage",description:"The passage is blocked by a slab with four rotating rings of digits.",openedText:"The slab has slid aside. Behind it is a dark corridor to the Hall of Hieroglyphs."}}},hieroglify:{name:"Hall of Hieroglyphs",intro:"The Hall of Hieroglyphs is plunged in darkness. At the far end there is a dark niche, and on the opposite wall – a gate with a beetle-shaped hollow.",objects:{h_nisza:{name:"Dark niche",description:"A completely dark niche. You will see nothing here without light.",lockedText:"Too dark. A light source would help.",openedText:"The torch lights up the niche and the wall full of hieroglyphs next to it.",message:"The torch’s flame brings a wall covered in hieroglyphs out of the darkness!"},h_sciana:{name:"Wall of hieroglyphs",description:"Rows of signs form a sequence of numbers. One is missing.",openedText:"The pressed stone opened a hiding place in the niche.",message:"You press the right sign… Something grinds in the niche and a hiding place opens!"},h_papirus:{name:"Papyrus",description:"A priest’s rolled-up papyrus."},h_skrzynia:{name:"Chest with symbols",description:"A painted chest with three wheels of shape symbols.",openedText:"The chest is open.",message:"The lid rises. Inside a golden scarab glitters!"},h_waga:{name:"Priests’ balance",description:"A bronze balance with pans. A task is carved next to it.",openedText:"The pans are balanced."},h_powrot:{name:"Corridor to the entrance chamber",description:"The way back to the entrance chamber."},h_wrota:{name:"Scarab gate",description:"A stone gate with a scarab-shaped hollow.",lockedText:"The hollow is empty. Something must fit into it…",openedText:"The scarab flashed and the gate slid open."}}},geometria:{name:"Geometry hall",intro:"The geometry hall. Shapes on the walls, a pyramid model on a plinth and, in the middle, a heavy sarcophagus.",objects:{g_figury:{name:"Wall of shapes",description:"Movable stone tiles with shapes and numbers. They need to be matched in pairs.",openedText:"The wall moved aside, revealing a hidden door.",message:"A grinding sound – part of the wall slides away and reveals a hidden door!"},g_inskrypcja:{name:"Inscription",description:"An inscription in the stone, right above the sarcophagus."},g_model:{name:"Pyramid model",description:"A stone pyramid model on a plinth. A task is carved on the plinth.",openedText:"The number 60 glows on the model."},g_misa:{name:"Fire bowl",description:"A bronze bowl with glowing embers. The warmth is pleasant on your hands."},g_plyty:{name:"Floor slabs",description:"One of the floor slabs has a task carved into it.",openedText:"The floor task is solved."},g_sarkofag:{name:"Sarcophagus",description:"A gilded sarcophagus with three stone rings on its lid.",openedText:"The sarcophagus lid has been pushed aside.",message:"The lid slides. Instead of a mummy – a key shaped like the sun!"},g_powrot:{name:"Gate to the Hall of Hieroglyphs",description:"The way back to the Hall of Hieroglyphs."},g_drzwi:{name:"Hidden door",description:"A door with a sun symbol. In the middle is a round keyhole.",lockedText:"The keyhole is shaped like a sun with rays.",openedText:"The door is open. It leads to the treasure chamber."}}},skarbiec:{name:"Treasure chamber",intro:"The treasure chamber shines with gold. On the ceiling – a star map; in front of you, an altar with plates and behind it the closed Sun Gate.",objects:{s_skarb:{name:"Pile of treasure",description:"Caskets full of coins. A task is engraved on one of them.",openedText:"The treasure has been counted – but it stays where it is."},s_gwiazdy:{name:"Star map",description:"A star map shines on the wall. An inscription is carved between the constellations."},s_klepsydra:{name:"Hourglass",description:"A huge hourglass. The sand trickles very slowly."},s_oltarz:{name:"Altar with plates",description:"An altar with six plates that can be pressed.",openedText:"The plates have sunk. The mechanism is working!",message:"A deep rumble of machinery… The Sun Gate has moved!"},s_posag:{name:"Golden statue",description:"A golden statue of the pharaoh gazes towards the Sun Gate."},s_powrot:{name:"Door to the geometry hall",description:"The way back to the geometry hall."},s_brama:{name:"Sun Gate",description:"A huge gate leading outside. It is moved by the altar mechanism.",lockedText:"The gate will not budge. Start the altar mechanism.",openedText:"The gate is open. You can see the sun!"}}}}},As="Lock: a LETTER and a two-digit number. The letter comes from the monitor with the table, the number from the printout.",Ls="The console has three power dials: X, Y, Z.",sm={title:"The Science Laboratory",subtitle:"Chapter III – System Failure",description:"The security system of a modern laboratory has failed. The doors are locked and the power is going down. Restart the devices one by one and restore power in the control centre.",intro:"The last page of the notebook of the Class of 1926 contained the address of a modern laboratory. You have barely stepped inside when a siren sounds: “SECURITY SYSTEM FAILURE. DOORS LOCKED”. The lights switch to emergency mode. To get out, you must restore the power step by step.",ending:"The power console glows green: “POWER RESTORED. LOCKDOWN LIFTED”. The emergency doors slide open with a hiss. One more message appears on the screen: “Thank you, Guardian of Numbers. More missions are waiting: a bank, a space station, a lost city…”.",reward:"Lab Rescuer",items:{karta_dostepu:{name:"Access card",description:"A laboratory card with access level 1."},klucz_narzedzia:{name:"Small key",description:"A small key labelled “Toolbox”."},bezpiecznik:{name:"Fuse",description:"A spare 16 A fuse."}},clues:{notatnik:{title:"Lab technician’s notebook",text:"“Reagent cabinet code (4 digits): BEAKERS (two digits), then MICROSCOPE, then WHITEBOARD.”"},zlewki_wynik:{title:"Result from the beakers",text:"The beaker task gives the number 40 – the first two digits of the cabinet code."},mikroskop:{title:"Slide under the microscope",text:G("The slide is labelled: “Digit = number of cells: 3² − 2”.","On the slide: “A cell divides in two every hour. Digit = after how many hours one cell becomes 128 cells”.","On the slide: “The image of a cell is 2.8 mm at 400× magnification. Digit = the real size of the cell in micrometres (μm)”.")},tablica:{title:"Whiteboard",text:G("Written on the board: “Digit = x, if x ÷ 4 = 2”.","Written on the board: “f(x) = 2x − 3. Digit = the argument for which f(x) = 13”.","Written on the board: “Digit = the energy (kWh) used by a 2 kW device running for 4 h”.")},tabela:{title:"Monitor with the sample table",text:G("“The LETTER of the storeroom door password = the sample whose temperature equals the MEAN temperature of all samples.”","“The LETTER of the storeroom door password = the sample for which f(x) = x² − 6x + 10 is the SMALLEST.”","“The LETTER of the storeroom door password = the production line with the HIGHEST output (pieces per hour).”"),visual:G({type:"table",title:"Sample temperatures",headers:["Sample","A","B","C","D","E"],rows:[["°C",12,18,9,15,21]]},{type:"table",title:"Samples – parameter x",headers:["Sample","A","B","C","D","E"],rows:[["x",1,2,3,4,5]]},{type:"table",title:"Production lines",headers:["Line","A","B","C","D","E"],rows:[["pieces",480,350,420,300,540],["hours worked",8,5,7,4,9]]})},wydruk:{title:"Printout",text:G("“The NUMBER in the storeroom door password = the perimeter of a rectangle with sides 15 and 6.”","“The NUMBER in the storeroom door password = the sum of the first six terms of the sequence 2, 4, 6, 8, …”","“The NUMBER in the storeroom door password = 35% of 120.”")},lista:{title:"Inventory list",text:"“The toolbox key is in the shelf mechanism. The shelf releases its lock when the boxes are in the right order (see the labels).”"},wykres_mocy:{title:"Energy-use screen",text:G("“First digit of the console code = the consumption (kW) of the module that uses the LEAST energy.”","“First digit of the console code = the ROOT (x-intercept) of the linear function on the graph.”","“First digit of the console code = the number of months in which the energy cost EXCEEDED £400.”"),visual:G({type:"bars",title:"Module consumption (kW)",labels:["A","B","C","D"],values:[6,3,8,5],unit:"kW"},{type:"line",title:"Generator characteristic",xLabel:"x",yLabel:"y",points:[[0,-6],[1,-4],[2,-2],[3,0],[4,2]],connect:!0,extend:!0,xRange:[-2,6],yRange:[-8,4],grid:!0},{type:"bars",title:"Energy cost (£)",labels:["I","II","III","IV","V"],values:[350,420,380,450,410],unit:"£"})},dziennik:{title:"Fault log",text:G("“The console code is X, Y, Z. X – from the energy screen. Y = (X + 9) ÷ 2. Z = Y − X + 2.”","“The console code is X, Y, Z. X – from the screen. Y = log₂ 64. Z satisfies the equation 2Z − Y = 4.”","“The console code is X, Y, Z. X – from the cost screen. Y = the power (kW) of a 230 V, 26 A device, rounded to a whole number. Z = the pump output in l/min if it pumps 300 l per hour.”")}},puzzles:{zlewki:{sp:{title:"Beakers of solution",unit:"ml",prompt:"Instructions: “Mix 2 parts concentrate with 3 parts water”. How many ml of concentrate should be added to 60 ml of water?",hints:["The ratio of concentrate to water must stay 2 : 3.","60 ml of water is 3 parts – how many ml is one part?","60 ÷ 3 = 20 ml; 2 · 20 = 40 ml."]},lo:{title:"Beakers of solution",unit:"g",prompt:"How many grams of salt must be dissolved in 160 g of water to get a 20% solution?",hints:["Concentration = mass of solute / mass of the WHOLE solution.","s / (s + 160) = 0.2.","s = 0.2s + 32 → 0.8s = 32 → s = 40 g."]},tech:{title:"Beakers of solution",unit:"l",prompt:"How many litres of 25% concentrate are needed to make 100 l of 10% solution after diluting with water?",hints:["Water does not change the amount of pure substance.","Pure substance in the final solution: 10% · 100 l = 10 l.","0.25 · x = 10 → x = 40 l."]}},szafka:{title:"Reagent cabinet",prompt:"The cabinet’s electronic lock: 4 digits.",hints:["The technician’s notebook says where the digits come from and in what order.","The beakers give a two-digit number; the microscope and the whiteboard give one digit each.","Beakers: 40, microscope: 7, whiteboard: 8 → 4078."]},robot:{sp:{title:"Cleaning robot",unit:"m",prompt:"The robot drove 3 laps around a 4 m × 6 m rectangular table. How many metres did it travel?",hints:["One lap is the perimeter of the rectangle.","Perimeter = 2 · (4 + 6) = 20 m.","3 · 20 = 60 m."]},lo:{title:"Cleaning robot",unit:"m",prompt:"The robot drove 10 m in a straight line at 30° to the wall. How many metres did it move away from the wall?",hints:["Draw a right-angled triangle: the robot’s path is the hypotenuse.","The distance from the wall is opposite the 30° angle: d = 10 · sin 30°.","d = 10 · 1/2 = 5 m."]},tech:{title:"Cleaning robot",unit:"min",prompt:"The robot’s battery has a capacity of 5 Ah and the robot draws 2 A. How many minutes can it run?",hints:["Running time = capacity / current.","5 Ah ÷ 2 A = 2.5 h.","2.5 h = 150 min."]}},serwery:{sp:{title:"Server rack",prompt:"The backup power supply can handle EXACTLY 500 W. Switch on servers with a total draw of 500 W.",hints:["Try starting with the largest server.","500 − 300 = 200. Which servers add up to 200 W?","300 + 120 + 80 = 500 W."]},lo:{title:"Server rack",prompt:"The server loads are described by expressions. Switch on servers with a total load of EXACTLY 20.",switchLabels:["f(2), f(x) = x² + 1","log 1000","a₄ of 2, 4, 8, …","|−7|","sin²x + cos²x"],hints:["Evaluate each expression.","f(2) = 5, log 1000 = 3, a₄ = 16, |−7| = 7, sin²x + cos²x = 1.","16 + 3 + 1 = 20."]},tech:{title:"Server rack",prompt:"The UPS has a power of 1.6 kW. Switch on servers with a total draw of EXACTLY 1.6 kW.",switchLabels:["0.4 kW","250 W","1.1 kW","350 W","0.6 kW"],hints:["Convert everything to watts.","400, 250, 1100, 350, 600 W; target: 1600 W.","400 + 250 + 350 + 600 = 1600 W."]}},terminal:{sp:{title:"Terminal – temperature graph",prompt:"The terminal asks: “At what time was the temperature in the chamber HIGHEST?”",visual:{type:"line",title:"Chamber temperature (°C)",xLabel:"hour",yLabel:"°C",points:[[8,18],[10,22],[12,27],[14,25],[16,21]],connect:!0,xRange:[7,17],yRange:[0,30],grid:!0},options:["8:00","10:00","12:00","14:00"],hints:["Look for the highest point on the graph.","Read the values: 18, 22, 27, 25, 21 °C.","The highest temperature (27 °C) was at 12:00."]},lo:{title:"Terminal – graph of a function",prompt:"The terminal asks: “Which formula describes the function on the graph?”",visual:{type:"line",title:"Graph of a function",xLabel:"x",yLabel:"y",points:[[0,2],[3,-4]],connect:!0,extend:!0,xRange:[-2,5],yRange:[-6,6],grid:!0},options:["y = 2x + 2","y = −2x + 2","y = −0.5x + 2","y = −2x − 2"],hints:["Read where the line crosses the y-axis and check whether it rises or falls.","c = 2. m = (−4 − 2)/(3 − 0).","m = −2, c = 2 → y = −2x + 2."]},tech:{title:"Terminal – production cost",prompt:"The terminal asks: “The graph shows the cost K of producing n items. What are the fixed cost and the cost per item?”",visual:{type:"line",title:"Production cost K(n) [£]",xLabel:"n (items)",yLabel:"£",points:[[0,500],[10,700],[20,900]],connect:!0,xRange:[0,25],yRange:[0,1100],grid:!0},options:["£200 and £50/item","£500 and £20/item","£500 and £70/item","£700 and £20/item"],hints:["The fixed cost is paid even when n = 0.","K(0) = 500. By how much does the cost rise for 10 more items?","(700 − 500) / 10 = £20/item. Answer: £500 and £20/item."]}},kubek:{sp:{title:"Programmer’s mug",unit:"mugs",prompt:"The mug says: “I hold 250 ml”. How many such mugs can you fill from 2 l of coffee?",hints:["Convert litres to millilitres.","2 l = 2000 ml.","2000 ÷ 250 = 8 mugs."]},lo:{title:"Programmer’s mug",prompt:"The mug says: “3^(x+1) = 81”. Find x.",hints:["Write 81 as a power of three.","81 = 3⁴, so x + 1 = 4.","x = 3."]},tech:{title:"Programmer’s mug",unit:"m/s",prompt:"The mug says: “My forklift goes 72 km/h”. How many m/s is that?",hints:["1 km = 1000 m, 1 h = 3600 s.","Divide a speed in km/h by 3.6.","72 ÷ 3.6 = 20 m/s."]}},drzwi_magazyn:{sp:{title:"Storeroom door",prompt:As,hints:["You need the monitor with the table and the printout (start the terminal first).","Mean = sum ÷ 5. Perimeter of a rectangle = 2(a + b).","Mean: 75 ÷ 5 = 15 → sample D. Perimeter: 2 · 21 = 42. Password: D42."]},lo:{title:"Storeroom door",prompt:As,hints:["You need the monitor with the table and the printout (start the terminal first).","Vertex of a parabola: p = −b/(2a). Sum of an arithmetic sequence: Sₙ = (a₁ + aₙ)/2 · n.","p = 3 → sample C (f(3) = 1). S₆ = (2 + 12)/2 · 6 = 42. Password: C42."]},tech:{title:"Storeroom door",prompt:As,hints:["You need the monitor with the table and the printout (start the terminal first).","Output = pieces ÷ hours. 35% = 0.35.","A 60, B 70, C 60, D 75, E 60 pieces/h → D. 0.35 · 120 = 42. Password: D42."]}},pudla:{sp:{title:"Shelf with boxes",orderLabel:["smallest volume","largest volume"],prompt:"Arrange the boxes (cuboids, dimensions in dm) from the SMALLEST to the LARGEST volume.",items:["D: 4 × 4 × 1","B: 5 × 2 × 2","A: 2 × 3 × 4","E: 1 × 5 × 5","C: 3 × 3 × 3"],hints:["Work out the volume of each box.","V = a · b · c.","D = 16, B = 20, A = 24, E = 25, C = 27 dm³."]},lo:{title:"Shelf with containers",orderLabel:["smallest volume","largest volume"],prompt:"Arrange the containers from the SMALLEST to the LARGEST volume (dimensions in dm).",items:["pyramid: base 9 × 9, H = 4","sphere: r = 3","cube: a = 5","cylinder: r = 3, h = 5","cone: r = 6, h = 4"],hints:["Work out the volumes, taking π ≈ 3.14.","Pyramid 1/3·base·H, sphere 4/3πr³, cylinder πr²h, cone 1/3πr²h.","108 < 36π ≈ 113 < 125 < 45π ≈ 141 < 48π
